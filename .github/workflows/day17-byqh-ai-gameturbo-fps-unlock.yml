name: Day 17 - By_qh AI Game Turbo 5.0, Unlock 120 FPS, Sound Radar 3D & AI Low Ping Network

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  byqh-day17-gameturbo-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 1. Integrate Game Unlocker Spoofing (ROG Phone 8 & RedMagic 9 Pro)
        run: |
          mkdir -p vendor/custom/config/game
          cat << 'MAKEFILE' > vendor/custom/config/game/game_unlocker.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.game_unlocker=enabled \
              persist.vendor.game.unlock_fps=120 \
              ro.product.vendor.model=ASUS_AI2401 \
              ro.product.vendor.manufacturer=asus \
              ro.product.vendor.brand=ASUS \
              ro.product.vendor.device=ASUS_AI2401 \
              persist.sys.game.spoof_device=true
          MAKEFILE

      - name: 2. AI Sound Radar 3D Spatial Audio Tuning Engine
        run: |
          mkdir -p vendor/custom/config/audio
          cat << 'XML' > vendor/custom/config/audio/sound_radar_3d.xml
          <?xml version="1.0" encoding="utf-8"?>
          <sound_radar_config>
              <gaming_audio_boost>
                  <footstep_enhancer level="max" frequency_range="1000Hz-4000Hz"/>
                  <gunfire_direction_3d enabled="true"/>
                  <spatial_surround_sound_virtualizer enabled="true"/>
                  <low_latency_audio_buffer_ms>10</low_latency_audio_buffer_ms>
              </gaming_audio_boost>
          </sound_radar_config>
          XML

          cat << 'MAKEFILE' > vendor/custom/config/audio/gaming_audio_props.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.sound_radar_3d=enabled \
              persist.vendor.audio.spatializer.enabled=true \
              audio.deep_buffer.media=false \
              vendor.audio.feature.spatial.enable=true
          MAKEFILE

      - name: 3. AI Low-Ping Network & Gaming DNS Routing
        run: |
          mkdir -p vendor/custom/config/network
          cat << 'MAKEFILE' > vendor/custom/config/network/game_net_turbo.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.net_turbo=enabled \
              net.dns1=1.1.1.1 \
              net.dns2=8.8.8.8 \
              persist.sys.game_net_priority=1 \
              net.tcp.buffersize.wifi=524288,2097152,4194304,262144,524288,1048576 \
              net.tcp.buffersize.lte=524288,2097152,4194304,262144,524288,1048576
          MAKEFILE

      - name: 4. AI Smart Game Hibernation
        run: |
          mkdir -p vendor/custom/config/ai
          cat << 'MAKEFILE' > vendor/custom/config/ai/game_hibernation.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.ai.game_hibernation=enabled \
              persist.sys.ai.freeze_non_essential_apps=true \
              persist.sys.ai.whitelist_banking_apps=true
          MAKEFILE

      - name: 5. Inject All Day 17 Configurations to Device Makefile
        run: |
          mkdir -p device/generic/common
          touch device/generic/common/device.mk

          cat << 'MAKEFILE' >> device/generic/common/device.mk

          # ==================== DAY 17: BY_QH AI GAME TURBO 5.0 ====================
          $(call inherit-product, vendor/custom/config/game/game_unlocker.mk)$(call inherit-product, vendor/custom/config/audio/gaming_audio_props.mk)
          $(call inherit-product, vendor/custom/config/network/game_net_turbo.mk)$(call inherit-product, vendor/custom/config/ai/game_hibernation.mk)

          PRODUCT_COPY_FILES += \
              vendor/custom/config/audio/sound_radar_3d.xml:$(TARGET_COPY_OUT_VENDOR)/etc/sound_radar_3d.xml

          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.gameturbo.version=5.0 \
              ro.byqh.sound.radar=3d_active \
              ro.byqh.ping_booster=active
          MAKEFILE

      - name: 6. Verify Created Files
        run: |
          ls -la vendor/custom/config/game/game_unlocker.mk
          ls -la vendor/custom/config/audio/sound_radar_3d.xml
          ls -la vendor/custom/config/network/game_net_turbo.mk
          ls -la vendor/custom/config/ai/game_hibernation.mk
          ls -la device/generic/common/device.mk
          echo "=== NGÀY 17: TÍCH HỢP BY_QH AI GAME TURBO 5.0 HOÀN THÀNH ==="
