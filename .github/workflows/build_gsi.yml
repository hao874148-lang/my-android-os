
name: Build LineageOS GSI ROM for Samsung A32

on:
  workflow_dispatch:

jobs:
  build-gsi:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Dọn dẹp ổ đĩa máy chủ
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: 2. Cài đặt công cụ
        run: |
          sudo apt update
          sudo apt install -y wget xz-utils zip curl jq

      - name: 3. Tải GSI LineageOS (Tự động lấy link từ SourceForge)
        run: |
          mkdir -p output
          cd output
          
          echo "=== Đang quét SourceForge để tìm bản GSI arm64_bvS mới nhất ==="
          # Quét trang chủ SourceForge của AndyYan để lấy link tải file
          SF_PAGE=$(curl -s https://sourceforge.net/projects/andyyan-gsi/files/lineage-21.0/)
          
          # Lọc lấy đường dẫn trực tiếp có chứa đuôi arm64_bvS.img.xz
          DOWNLOAD_URL=$(echo "$SF_PAGE" | grep -o 'https://sourceforge.net/projects/andyyan-gsi/files/lineage-21.0/[^"]*arm64_bvS.img.xz/download' | head -n 1)
          
          # Kiểm tra an toàn
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "❌ LỖI: Không tìm thấy link tải GSI arm64_bvS trên SourceForge."
            echo "Có thể tác giả chưa up bản mới, hoặc cấu trúc trang đã đổi."
            exit 1
          fi
          
          echo "=== Đang tải từ link: $DOWNLOAD_URL ==="
          # Tải file (wget tự động theo dõi redirect của SourceForge)
          wget -O gsi_base.img.xz "$DOWNLOAD_URL"
          
          echo "=== Giải nén file ==="
          xz -d gsi_base.img.xz
          mv *.img system.img
          ls -lh

      - name: 4. Nén thành file ROM cài đặt (.zip)
        run: |
          cd output
          zip -r9 LineageOS_GSI_Samsung_A32.zip system.img

      - name: 5. Xuất file ROM lên GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS_ROM_Samsung_A32
          path: output/LineageOS_GSI_Samsung_A32.zip
