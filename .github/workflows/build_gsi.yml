name: Build LineageOS GSI ROM for Samsung A32

on:
  workflow_dispatch:

jobs:
  build-gsi:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Dọn dẹp ổ đĩa máy chủ
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: 2. Cài đặt công cụ
        run: |
          sudo apt update
          sudo apt install -y wget xz-utils zip

      - name: 3. Tải GSI LineageOS 20 (Android 13 - AndyYan)
        run: |
          mkdir -p output
          cd output
          # Tải bản GSI LineageOS 20 arm64-bvS chuẩn
          wget -O gsi_base.img.xz "https://github.com/AndyYan/LineageOS_GSI/releases/download/lineage-20-20240315/lineage-20.0-20240315-UNOFFICIAL-arm64-bvS.img.xz"
          xz -d gsi_base.img.xz
          mv lineage-20.0-20240315-UNOFFICIAL-arm64-bvS.img system.img

      - name: 4. Nén thành file ROM cài đặt (.zip)
        run: |
          cd output
          zip -r9 LineageOS_20_GSI_Samsung_A32.zip system.img

      - name: 5. Xuất file ROM lên GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS_20_ROM_Samsung_A32
          path: output/LineageOS_20_GSI_Samsung_A32.zip
