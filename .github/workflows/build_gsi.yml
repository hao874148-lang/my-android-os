name: Build LineageOS GSI ROM for Samsung A32

on:
  workflow_dispatch:

jobs:
  build-gsi:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Dọn dẹp ổ đĩa máy chủ
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: 2. Cài đặt công cụ
        run: |
          sudo apt update
          sudo apt install -y wget xz-utils zip curl jq

      - name: 3. Tải GSI LineageOS (Cơ chế tự tìm & dự phòng an toàn)
        run: |
          mkdir -p output
          cd output
          
          echo "=== Đang quét SourceForge để tìm bản GSI arm64_bvS mới nhất ==="
          # Quét trang SourceForge
          SF_PAGE=$(curl -s -L https://sourceforge.net/projects/andyyan-gsi/files/lineage-21.0/)
          
          # Lọc lấy đường dẫn tương đối (link trong HTML SourceForge thường là dạng /projects/...)
          REL_URL=$(echo "$SF_PAGE" | grep -o '/projects/andyyan-gsi/files/lineage-21.0/[^"]*arm64_bvS.img.xz/download' | head -n 1)
          
          if [ -n "$REL_URL" ]; then
            DOWNLOAD_URL="https://sourceforge.net${REL_URL}"
            echo "=== Đã quét thành công link động ==="
          else
            echo "⚠️ Cảnh báo: Không quét được link động. Chuyển sang dùng link dự phòng trực tiếp."
            # Link dự phòng vững chắc nhất (bản ổn định gần nhất)
            DOWNLOAD_URL="https://sourceforge.net/projects/andyyan-gsi/files/lineage-21.0/lineage-21.0-20231115-UNOFFICIAL-treble_arm64_bvS.img.xz/download"
          fi
          
          echo "=== Đang tải từ link: $DOWNLOAD_URL ==="
          # Tải file (wget tự động theo dõi redirect của SourceForge)
          wget -O gsi_base.img.xz "$DOWNLOAD_URL"
          
          echo "=== Giải nén file ==="
          xz -d gsi_base.img.xz
          mv *.img system.img
          ls -lh

      - name: 4. Nén thành file ROM cài đặt (.zip)
        run: |
          cd output
          zip -r9 LineageOS_GSI_Samsung_A32.zip system.img

      - name: 5. Xuất file ROM lên GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS_ROM_Samsung_A32
          path: output/LineageOS_GSI_Samsung_A32.zip
