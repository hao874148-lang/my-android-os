name: Build LineageOS GSI ROM for Samsung A32

on:
  workflow_dispatch:

jobs:
  build-gsi:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Dọn dẹp ổ đĩa máy chủ
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: 2. Cài đặt công cụ
        run: |
          sudo apt update
          sudo apt install -y wget xz-utils zip curl jq

      - name: 3. Tải GSI LineageOS (Tự động lấy link mới nhất)
        run: |
          mkdir -p output
          cd output
          # Tự động quét API GitHub để lấy link tải bản GSI arm64 mới nhất
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/AndyYan/LineageOS_GSI/releases | jq -r '.[].assets[].browser_download_url' | grep -i 'arm64-bvS' | head -n 1)
          echo "Đang tải từ link: $DOWNLOAD_URL"
          
          wget -O gsi_base.img.xz "$DOWNLOAD_URL"
          xz -d gsi_base.img.xz
          mv *.img system.img

      - name: 4. Nén thành file ROM cài đặt (.zip)
        run: |
          cd output
          zip -r9 LineageOS_GSI_Samsung_A32.zip system.img

      - name: 5. Xuất file ROM lên GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS_ROM_Samsung_A32
          path: output/LineageOS_GSI_Samsung_A32.zip
