
name: Build LineageOS GSI ROM for Samsung A32

on:
  workflow_dispatch:

jobs:
  build-gsi:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Dọn dẹp ổ đĩa máy chủ
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: 2. Cài đặt công cụ
        run: |
          sudo apt update
          sudo apt install -y wget xz-utils zip curl jq

      - name: 3. Tải GSI LineageOS (Tự động lấy link mới nhất)
        run: |
          mkdir -p output
          cd output
          
          # Gọi API GitHub để lấy danh sách release
          API_JSON=$(curl -s https://api.github.com/repos/AndyYan/LineageOS_GSI/releases)
          
          # Lọc lấy link tải xuống (dùng .[0] để lấy bản mới nhất, grep 'arm64_bvS.img.xz' để lấy đúng file)
          DOWNLOAD_URL=$(echo "$API_JSON" | jq -r 'if type == "array" then .[0].assets[].browser_download_url else empty end' | grep 'arm64_bvS.img.xz' | head -n 1)
          
          # Kiểm tra nếu không tìm thấy link (tránh lỗi host name rỗng)
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "❌ LỖI: Không tìm thấy link tải GSI. Có thể do GitHub giới hạn API (Rate limit) hoặc tên file đã đổi."
            echo "Nội dung API trả về:"
            echo "$API_JSON" | head -n 20
            exit 1
          fi
          
          echo "=== Đang tải từ link: $DOWNLOAD_URL ==="
          wget -O gsi_base.img.xz "$DOWNLOAD_URL"
          
          echo "=== Giải nén file ==="
          xz -d gsi_base.img.xz
          mv *.img system.img
          ls -lh

      - name: 4. Nén thành file ROM cài đặt (.zip)
        run: |
          cd output
          zip -r9 LineageOS_GSI_Samsung_A32.zip system.img

      - name: 5. Xuất file ROM lên GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS_ROM_Samsung_A32
          path: output/LineageOS_GSI_Samsung_A32.zip
