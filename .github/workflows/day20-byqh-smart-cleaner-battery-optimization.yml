name: Day 20 - By_qh Smart Cleaner, Lag Fix Engine & Smart Battery Charging Control

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  byqh-day20-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 1. Integrate Smart Cleaner Engine
        run: |
          mkdir -p vendor/custom/config/cleaner
          cat << 'RC' > vendor/custom/config/cleaner/init.byqh.cleaner.rc
          on property:sys.boot_completed=1
              exec - root -- /system/bin/sm fstrim
              
          on property:sys.byqh.clean_junk=1
              exec - root -- /system/bin/rm -rf /data/local/tmp/*
              exec - root -- /system/bin/rm -rf /cache/*
              setprop sys.byqh.clean_junk 0
          RC

          cat << 'MAKEFILE' > vendor/custom/config/cleaner/cleaner_props.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.smart_cleaner=enabled \
              persist.sys.byqh.auto_fstrim=true \
              persist.sys.byqh.cache_cleaner=auto \
              pm.dexopt.bg-dexopt=speed-profile
          MAKEFILE

      - name: 2. Smart Battery Charging Controller
        run: |
          mkdir -p vendor/custom/config/battery
          cat << 'RC' > vendor/custom/config/battery/init.byqh.smart_charge.rc
          on property:persist.sys.battery.charge_limit=80
              write /sys/class/power_supply/battery/charge_control_limit_max 80

          on property:persist.sys.battery.charge_limit=100
              write /sys/class/power_supply/battery/charge_control_limit_max 100
          RC

          cat << 'MAKEFILE' > vendor/custom/config/battery/smart_charge_props.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.smart_charging=enabled \
              persist.sys.battery.charge_limit=80 \
              persist.sys.battery.thermal_control=true \
              ro.ril.power_collapse=1 \
              persist.vendor.power.smart_charge=1
          MAKEFILE

      - name: 3. Lag Killer & Performance Engine
        run: |
          mkdir -p vendor/custom/config/performance
          cat << 'MAKEFILE' > vendor/custom/config/performance/lag_killer_props.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.lag_killer=active \
              debug.atrace.tags.enableflags=0 \
              persist.sys.ui.hw=true \
              ro.config.hw_quickpoweron=true \
              ro.sys.fw.dex2oat_thread_count=4 \
              dalvik.vm.dex2oat-filter=speed \
              dalvik.vm.image-dex2oat-filter=speed
          MAKEFILE

      - name: 4. Inject All Day 20 Configurations to Device Makefile
        run: |
          mkdir -p device/generic/common
          touch device/generic/common/device.mk

          cat << 'MAKEFILE' >> device/generic/common/device.mk

          # ==================== DAY 20: BY_QH SMART CLEANER & BATTERY OPTIMIZATION ====================
          $(call inherit-product, vendor/custom/config/cleaner/cleaner_props.mk)
          $(call inherit-product, vendor/custom/config/battery/smart_charge_props.mk)$(call inherit-product, vendor/custom/config/performance/lag_killer_props.mk)

          PRODUCT_COPY_FILES += \
              vendor/custom/config/cleaner/init.byqh.cleaner.rc:$(TARGET_COPY_OUT_VENDOR)/etc/init/hw/init.byqh.cleaner.rc \
              vendor/custom/config/battery/init.byqh.smart_charge.rc:$(TARGET_COPY_OUT_VENDOR)/etc/init/hw/init.byqh.smart_charge.rc

          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.day20.status=COMPLETED \
              ro.byqh.ready_for_zip_build=true
          MAKEFILE

      - name: 5. System Integrity Check & Verification
        run: |
          echo "========================================================="
          echo "       BY_QH OS VIP ANDROID 16 - DAY 20 FINAL CHECK       "
          echo "========================================================="
          ls -la vendor/custom/config/cleaner/init.byqh.cleaner.rc || exit 1
          ls -la vendor/custom/config/battery/init.byqh.smart_charge.rc || exit 1
          ls -la vendor/custom/config/performance/lag_killer_props.mk || exit 1
          ls -la device/generic/common/device.mk || exit 1
          echo "========================================================="
          echo " NGÀY 20 THÀNH CÔNG! SẴN SÀNG 100% CHO NGÀY 21 XUẤT ZIP!  "
          echo "========================================================="
