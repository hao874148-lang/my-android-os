name: Day 23 - By_qh Extreme Network Boost (5G/4G CA), DoH Low-Ping & Privacy Vault
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  byqh-day23-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 1. Extreme Network Boost (5G/4G Carrier Aggregation & Wi-Fi 6E)
        run: |
          mkdir -p vendor/custom/config/network
          cat << 'MAKEFILE' > vendor/custom/config/network/extreme_network_boost.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.network_boost=ultra \
              persist.vendor.radio.5g_mode_pref=1 \
              persist.vendor.radio.data_con_rdx=1 \
              persist.vendor.radio.appstmw=1 \
              persist.vendor.radio.mtss_enable=1 \
              persist.vendor.radio.lte_vrte=1 \
              persist.vendor.radio.enableadvanced=1 \
              persist.vendor.radio.sib1_allow_5g=1 \
              wifi.interface=wlan0 \
              persist.sys.wifi_6e_enabled=true \
              persist.vendor.wifi.rts_enable=1 \
              ro.wifi.tkip=0
          MAKEFILE

      - name: 2. DNS Over HTTPS (DoH) & Low-Ping Gaming Config
        run: |
          mkdir -p vendor/custom/config/network
          cat << 'RC' > vendor/custom/config/network/init.byqh.doh.rc
          on boot
              setprop net.dns1 1.1.1.1
              setprop net.dns2 8.8.8.8
              setprop persist.sys.private_dns cloudflare
          RC
          cat << 'MAKEFILE' > vendor/custom/config/network/doh_props.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.doh=enabled \
              persist.sys.private_dns_mode=provider \
              persist.sys.private_dns_specifier=dns.cloudflare.com \
              net.dns1=1.1.1.1 \
              net.dns2=1.0.0.1 \
              persist.sys.ipv6_enabled=true
          MAKEFILE

      - name: 3. Privacy Vault & System App Lock Framework
        run: |
          mkdir -p vendor/custom/config/privacy
          cat << 'MAKEFILE' > vendor/custom/config/privacy/privacy_vault.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.privacy_vault=enabled \
              ro.byqh.app_lock=system_integrated \
              persist.sys.sensors.off_screen_privacy=1 \
              persist.sys.disable_screenshot_app_lock=1 \
              ro.byqh.network_privacy=strict \
              persist.sys.vpn_lockdown=0
          PRODUCT_PACKAGES += \
              ByqhPrivacyVault
          MAKEFILE

      - name: 4. Inject Day 23 Rules into Device Makefile
        run: |
          mkdir -p device/generic/common
          touch device/generic/common/device.mk
          cat << 'MAKEFILE' >> device/generic/common/device.mk
          # ==================== DAY 23: NETWORK BOOST, DOH & PRIVACY VAULT ====================
          $(call inherit-product, vendor/custom/config/network/extreme_network_boost.mk)
          $(call inherit-product, vendor/custom/config/network/doh_props.mk)
          $(call inherit-product, vendor/custom/config/privacy/privacy_vault.mk)
          PRODUCT_COPY_FILES += \
              vendor/custom/config/network/init.byqh.doh.rc:$(TARGET_COPY_OUT_VENDOR)/etc/init/hw/init.byqh.doh.rc
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.day23.status=COMPLETED \
              ro.byqh.network_level=5g_ca_max \
              ro.byqh.privacy_level=fortress
          MAKEFILE

      - name: 5. System Integrity Check & Verification
        run: |
          echo "========================================================="
          echo " BY_QH OS VIP ANDROID 16 - DAY 23 INTEGRITY CHECK "
          echo "========================================================="
          ls -la vendor/custom/config/network/extreme_network_boost.mk || exit 1
          ls -la vendor/custom/config/network/doh_props.mk || exit 1
          ls -la vendor/custom/config/network/init.byqh.doh.rc || exit 1
          ls -la vendor/custom/config/privacy/privacy_vault.mk || exit 1
          ls -la device/generic/common/device.mk || exit 1
          echo "========================================================="
          echo " NGÀY 23 THÀNH CÔNG! MẠNG 5G/WI-FI 6E ĐỈNH CAO & BẢO MẬT TỐI THƯỢNG! "
          echo "========================================================="
