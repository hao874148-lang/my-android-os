name: By_qh OS Titanium Architect - 500K Lines Engine

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-titanium:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 1. Setup Environment & Toolchain
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/share/boost || true
          sudo apt-get clean || true
          sudo apt-get update || true
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf libncurses-dev libreadline-dev libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 liblz4-tool || true
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo

      - name: 2. Execute Mega Code Generator (Generate 500K+ Lines)
        run: |
          chmod +x generate_mega_engine.sh
          ./generate_mega_engine.sh

      - name: 3. Verify Line Count
        run: |
          echo "========================================================="
          echo " TỔNG SỐ DÒNG CODE ĐÃ ĐƯỢC SINH RA TRONG DỰ ÁN: "
          find vendor/custom/ -type f -exec cat {} + | wc -l
          echo "========================================================="

      - name: 4. Final Build Preparation
        run: |
          mkdir -p device/generic/common
          cat << 'MAKEFILE' > device/generic/common/device.mk
          # ====================================================================
          # BY_QH OS TITANIUM ARCHITECT - MASTER DEVICE MAKEFILE
          # ====================================================================
          
          PRODUCT_NAME := By_qh OS Titanium
          PRODUCT_BRAND := By_qh
          PRODUCT_MANUFACTURER := By_qh Studio
          PRODUCT_MODEL := By_qh Titanium 500K Edition
          
          # Nạp toàn bộ cấu hình khổng lồ
          $(call inherit-product, vendor/custom/config/byqh_branding.mk)
          $(call inherit-product, vendor/custom/config/byqh_titanium_mega.mk)
          
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.version=TITANIUM-500K-A16 \
              ro.byqh.edition=Architect \
              ro.byqh.os_status=MEGA_BUILD_READY
          MAKEFILE

      - name: 5. Commit & Push Titanium Architecture
        run: |
          git config --global user.name "hao874148-lang"
          git config --global user.email "lhao874148@gmail.com"
          git add .
          git commit -m "Upgrade to Titanium Architect: Inject 500K+ lines of hardware configs"
          git push origin main
