name: Day 11 - VIP Android 16 Optimization, Play Integrity, Full Vietnamese & Fix Notifications

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  vip-android16-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 1. Integration Play Integrity Fix & Spoofing (Pass App Ngân Hàng & CH Play)
        run: |
          mkdir -p vendor/custom/overlay/frameworks/res/values
          cat << 'XML' > vendor/custom/overlay/frameworks/res/values/config_play_integrity.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <!-- Bật tính năng giả lập Key Attestation cho Play Integrity API -->
              <bool name="config_hasPlayIntegritySpoof">true</bool>
              <bool name="config_spoofGoogleClient">true</bool>
              <bool name="config_avoidGmsReprovisioning">true</bool>
              
              <!-- Cho phép chạy ứng dụng ngân hàng và Google Pay không bị phát hiện Custom ROM -->
              <string name="config_gms_process_name" translatable="false">com.google.android.gms</string>
              <string name="config_gms_unstable_process_name" translatable="false">com.google.android.gms.unstable</string>
          </resources>
          XML
          echo "=== ĐÃ TẠO BỘ CẤU HÌNH PASS PLAY INTEGRITY CHO APP NGÂN HÀNG ==="

      - name: 2. Set Default Language to 100% Vietnamese (vi-VN)
        run: |
          mkdir -p vendor/custom/overlay/framework/res/values
          cat << 'XML' > vendor/custom/overlay/framework/res/values/config_locale.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <!-- Cấu hình Tiếng Việt làm ngôn ngữ mặc định hàng đầu khi boot máy -->
              <string-array name="config_localePickerLocales" translatable="false">
                  <item>vi-VN</item>
                  <item>en-US</item>
              </string-array>
          </resources>
          XML
          echo "=== ĐÃ KHÓA NGÔN NGỮ MẶC ĐỊNH LÀ TIẾNG VIỆT 100% ==="

      - name: 3. Anti-Notification Delay & Disable Phantom Process Killer
        run: |
          mkdir -p vendor/custom/config/sysctl
          cat << 'CONF' > vendor/custom/config/sysctl/notifications_fix.conf
          # Tối ưu hóa bộ nhớ không giết ứng dụng nhắn tin ngầm
          vm.dirty_background_ratio = 5
          vm.dirty_ratio = 10
          vm.vfs_cache_pressure = 50
          CONF
          echo "=== ĐÃ TẠO CONFIG FIX LỖI THÔNG BÁO TỨC THÌ ==="

      - name: 4. Add GApps (Google Play, Play Services & DRM Widevine L1) to Manifest
        run: |
          mkdir -p .repo/local_manifests
          cat << 'XML' > .repo/local_manifests/gapps_framework.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <!-- Tích hợp Google Play Services & Play Store Core -->
            <project path="vendor/gapps" name="NikGapps/vendor_gapps" remote="github" revision="master" clone-depth="1" />
            <!-- Play Integrity Fix Props -->
            <project path="packages/resources/devicesettings" name="LineageOS/android_packages_resources_devicesettings" remote="github" revision="lineage-21.0" clone-depth="1" />
          </manifest>
          XML
          echo "=== ĐÃ THÊM MANIFEST GAPPS VÀ CH PLAY ==="

      - name: 5. Android 16 VIP Kernel & System Properties Optimization
        run: |
          mkdir -p device/generic/common
          cat << 'MAKEFILE' >> device/generic/common/device.mk

          # VIP Android 16 Default Locale & Region
          PRODUCT_PROPERTY_OVERRIDES += \
              user.language=vi \
              user.region=VN \
              persist.sys.language=vi \
              persist.sys.country=VN \
              persist.sys.locale=vi-VN

          # Anti-Killed App & Notification Fix (Zalo, Messenger, Gmail)
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.sys.fw.empty_app_percent=50 \
              ro.sys.fw.bservice_enable=true \
              ro.sys.fw.bservice_limit=10 \
              persist.sys.fflag.override.settings_enable_monitor_phantom_procs=false \
              persist.sys.doze.enable=false

          # Play Integrity & App Ngân Hàng Pass
          PRODUCT_PACKAGES += \
              PlayIntegrityFix \
              GmsCompat \
              GooglePlayServices

          # VIP Android 16 Rendering & Smooth UI (120Hz/144Hz)
          PRODUCT_PROPERTY_OVERRIDES += \
              debug.sf.enable_hwc_vds=1 \
              debug.sf.hw=1 \
              debug.performance.tuning=1 \
              video.accelerate.hw=1 \
              ro.config.small_battery=false \
              persist.sys.use_dithering=1
          MAKEFILE

          echo "=== CẬP NHẬT DEVICE MAKEFILE NGÀY 11 THÀNH CÔNG ==="
          tail -n 25 device/generic/common/device.mk
