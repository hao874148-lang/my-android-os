name: Day 15 - By_qh Flagship iOS Pro Motion Smoothness, Ultra Low Latency & Physics Animations

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  byqh-ios-smoothness-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 1. Config iOS ProMotion Physics Animations & Framework Overlays
        run: |
          mkdir -p vendor/custom/overlay/frameworks/base/core/res/res/values
          cat << 'XML' > vendor/custom/overlay/frameworks/base/core/res/res/values/config_animation_ios.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <!-- Cấu hình độ mượt chuyển cảnh & gia tốc cử chỉ chuẩn iPhone ProMotion -->
              <integer name="config_activityShortDur">150</integer>
              <integer name="config_activityDefaultDur">220</integer>
              <integer name="config_activityLongDur">300</integer>
              <bool name="config_animateScreenLights">true</bool>
              <!-- Khai báo tần số quét mượt tối đa 120Hz/144Hz -->
              <integer name="config_defaultRefreshRate">120</integer>
              <integer name="config_peakRefreshRate">144</integer>
              <bool name="config_user_refresh_rate_toggle">true</bool>
          </resources>
          XML
          echo "=== ĐÃ TÍCH HỢP BỘ TẠO HIỆU ỨNG VẬT LÝ VÀ CHUYỂN CẢNH MƯỢT NHƯ IPHONE ==="

      - name: 2. SurfaceFlinger & SkiaVK Graphics Engine Tuning (Zero Micro-Stutter)
        run: |
          mkdir -p vendor/custom/config/smoothness
          cat << 'MAKEFILE' > vendor/custom/config/smoothness/ios_smoothness.mk
          # By_qh OS Flagship iOS-Grade Smoothness Properties
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.smoothness.profile=ios_pro_max \
              debug.renderengine.backend=skiavk \
              debug.sf.latch_unsignaled=1 \
              debug.sf.early_phase_offset_ns=5000000 \
              debug.sf.early_app_phase_offset_ns=5000000 \
              debug.sf.early_gl_phase_offset_ns=3000000 \
              debug.sf.high_fps_early_phase_offset_ns=6100000 \
              debug.sf.high_fps_early_app_phase_offset_ns=6100000 \
              debug.sf.high_fps_late_app_phase_offset_ns=2000000 \
              renderthread.skia.reduce_ops_task_splitting=true \
              ro.surface_flinger.use_content_detection_for_refresh_rate=true \
              sys.use_fifo_ui=1 \
              persist.sys.use_dithering=1
          MAKEFILE
          echo "=== ĐÃ KHỞI TẠO BỘ TỐI ƯU KHUNG HÌNH SURFACEFLINGER SKIAVK ==="

      - name: 3. Touch Input Latency Reduction & Touch Booster Script
        run: |
          mkdir -p vendor/custom/config/init
          cat << 'RC' > vendor/custom/config/init/init.byqh.touch.rc
          # By_qh OS Ultra Low Touch Latency Optimization
          on boot
              # Tăng tốc độ phản hồi điểm chạm cảm ứng
              write /sys/class/input/input0/enabled 1
              
          on property:sys.boot_completed=1
              # Ưu tiên CPU thread xử lý SurfaceFlinger & Touch Input
              write /dev/stune/foreground/schedtune.boost 50
              write /dev/stune/top-app/schedtune.boost 100
              write /dev/stune/top-app/schedtune.prefer_idle 1
          RC

          cat << 'MAKEFILE' >> vendor/custom/config/smoothness/ios_smoothness.mk

          # Ultra Touch Latency Properties
          PRODUCT_PROPERTY_OVERRIDES += \
              touch.pressure.scale=0.001 \
              touch.size.calibration=geometric \
              touch.size.scale=1 \
              view.scroll_friction=0.005 \
              ro.byqh.touch.sampling_rate=240
          MAKEFILE
          echo "=== ĐÃ TỐI ƯU CẢM ỨNG SIÊU NHẠY VÀ GIẢM TRỄ ĐẦU VÀO ==="

      - name: 4. Inject All Day 15 Smoothness Rules to Device Makefile
        run: |
          mkdir -p device/generic/common
          touch device/generic/common/device.mk

          cat << 'MAKEFILE' >> device/generic/common/device.mk

          # ==================== DAY 15: BY_QH FLAGSHIP IOS PRO SMOOTHNESS ====================
          $(call inherit-product, vendor/custom/config/smoothness/ios_smoothness.mk)

          PRODUCT_COPY_FILES += \
              vendor/custom/config/init/init.byqh.touch.rc:$(TARGET_COPY_OUT_VENDOR)/etc/init/hw/init.byqh.touch.rc
          MAKEFILE

          echo "=== CẬP NHẬT HOÀN TẤT DEVICE MAKEFILE CHO NGÀY 15 ==="
          tail -n 20 device/generic/common/device.mk

      - name: 5. Verify Created Files
        run: |
          ls -la vendor/custom/overlay/frameworks/base/core/res/res/values/config_animation_ios.xml
          ls -la vendor/custom/config/smoothness/ios_smoothness.mk
          ls -la vendor/custom/config/init/init.byqh.touch.rc
          ls -la device/generic/common/device.mk
          echo "=== NGÀY 15: TÍCH HỢP ĐỘ MƯỢT IPHONE PRO MOTION THÀNH CÔNG ==="
