name: Day 21 - By_qh Extreme System Debloat, Max CPU/GPU Gaming Boost, Ultra Battery Life & Fluid Animations

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  byqh-day21-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 1. System Debloater
        run: |
          mkdir -p vendor/custom/config/debloat
          cat << 'MAKEFILE' > vendor/custom/config/debloat/debloat_packages.mk
          PRODUCT_PACKAGES_REMOVE += \
              BasicDreams \
              BookmarkProvider \
              CellBroadcastReceiver \
              HTMLViewer \
              LiveWallpapersPicker \
              PrintServiceRecommendationService \
              PrintSpooler \
              Stk \
              Traceur \
              UserDictionaryProvider
          MAKEFILE

      - name: 2. Extreme CPU/GPU Gaming Overclock & FPS Max Tuning
        run: |
          mkdir -p vendor/custom/config/gaming
          cat << 'MAKEFILE' > vendor/custom/config/gaming/extreme_gaming_boost.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.extreme_gaming=enabled \
              persist.vendor.qti.games.gt.enable=true \
              vendor.perf.gesture.status=1 \
              debug.sf.latch_unsignaled=1 \
              debug.sf.enable_gl_backpressure=0 \
              debug.egl.hw=1 \
              debug.performance.tuning=1 \
              ro.sys.fw.use_trim_settings=true \
              persist.sys.performance.level=max
          MAKEFILE

      - name: 3. Ultra Battery Saving & Deep Sleep
        run: |
          mkdir -p vendor/custom/config/power
          cat << 'RC' > vendor/custom/config/power/init.byqh.battery_saver.rc
          on property:sys.boot_completed=1
              write /sys/module/wlan/parameters/pno_enable 1
              
          on property:fb.blankstate=1
              write /sys/devices/system/cpu/cpufreq/policy0/scaling_governor "powersave"
              
          on property:fb.blankstate=0
              write /sys/devices/system/cpu/cpufreq/policy0/scaling_governor "schedutil"
          RC

          cat << 'MAKEFILE' > vendor/custom/config/power/battery_saver_props.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.battery_saver=ultra \
              ro.ril.power_collapse=1 \
              pm.sleep_mode=1 \
              wifi.supplicant_scan_interval=300 \
              persist.sys.power.deep_sleep=true \
              ro.config.small_battery=false
          MAKEFILE

      - name: 4. Ultra-Fluid Animations
        run: |
          mkdir -p vendor/custom/overlay/frameworks/base/core/res/res/values
          cat << 'XML' > vendor/custom/overlay/frameworks/base/core/res/res/values/config_fluid_animations.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <integer name="config_activityShortDur">120</integer>
              <integer name="config_activityDefaultDur">180</integer>
              <integer name="config_activityLongDur">250</integer>
              <bool name="config_animateScreenLights">true</bool>
              <dimen name="config_horizontalSwipeThreshold">48dp</dimen>
          </resources>
          XML

          cat << 'MAKEFILE' > vendor/custom/config/gaming/animation_props.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.animations=super_fluid \
              view.scroll_friction=0.002 \
              persist.sys.scrollingcache=3 \
              windowsmgr.max_events_per_sec=240
          MAKEFILE

      - name: 5. Inject Day 21 Rules into Device Makefile
        run: |
          mkdir -p device/generic/common
          touch device/generic/common/device.mk

          cat << 'MAKEFILE' >> device/generic/common/device.mk

          # ==================== DAY 21: EXTREME DEBLOAT, MAX GAMING & ULTRA BATTERY ====================
          $(call inherit-product, vendor/custom/config/debloat/debloat_packages.mk)
          $(call inherit-product, vendor/custom/config/gaming/extreme_gaming_boost.mk)
          $(call inherit-product, vendor/custom/config/power/battery_saver_props.mk)
          $(call inherit-product, vendor/custom/config/gaming/animation_props.mk)

          PRODUCT_COPY_FILES += \
              vendor/custom/config/power/init.byqh.battery_saver.rc:$(TARGET_COPY_OUT_VENDOR)/etc/init/hw/init.byqh.battery_saver.rc

          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.day21.status=COMPLETED \
              ro.byqh.debloat_level=extreme \
              ro.byqh.gaming_level=maximum \
              ro.byqh.battery_level=ultra
          MAKEFILE

      - name: 6. System Verification
        run: |
          echo "========================================================="
          echo "     BY_QH OS VIP ANDROID 16 - DAY 21 INTEGRITY CHECK    "
          echo "========================================================="
          echo " NGÀY 21 HOÀN THÀNH TỐT VÀ SẴN SÀNG!                    "
          echo "========================================================="
