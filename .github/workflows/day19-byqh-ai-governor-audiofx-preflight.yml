name: Day 19 - By_qh AI Memory Engine, 4D Haptic Feedback, Vulkan 1.3 GPU Accelerator & System Verification

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  byqh-day19-ultra-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 1. AI Dynamic Thread Governor & FPS Lock Engine
        run: |
          mkdir -p vendor/custom/config/ai
          cat << 'MAKEFILE' > vendor/custom/config/ai/ai_thread_governor.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.ai.thread_governor=enabled \
              persist.sys.ai.fps_stabilizer=true \
              sys.games.fps_lock=unlocked \
              vendor.perf.top_app.big_core_lock=true \
              ro.sys.fw.bg_apps_cpu_limit=15 \
              persist.sys.game.fps_boost=true
          MAKEFILE

      - name: 2. AI Dynamic ZRAM 8GB & Extreme Memory Booster
        run: |
          mkdir -p vendor/custom/config/memory
          cat << 'MAKEFILE' > vendor/custom/config/memory/zram_booster.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.zram.size=8192 \
              ro.byqh.zram.algorithm=zstd \
              persist.sys.zram_enabled=true \
              ro.lmk.kill_heaviest_task=false \
              ro.lmk.psi_complete_stall_ms=70
          MAKEFILE

      - name: 3. 4D Haptic Feedback Gaming Vibration Engine
        run: |
          mkdir -p vendor/custom/config/haptics
          cat << 'MAKEFILE' > vendor/custom/config/haptics/haptic_4d.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.haptics.engine=4d_vibration \
              persist.sys.vibrator.game_haptic=true \
              persist.sys.vibrator.intensity=3
          MAKEFILE

      - name: 4. Vulkan 1.3 Pipeline GPU Acceleration & Thermal Chamber 2.0
        run: |
          mkdir -p vendor/custom/config/graphics
          cat << 'MAKEFILE' > vendor/custom/config/graphics/vulkan13_accel.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.vulkan.version=1.3 \
              debug.hwui.renderer=skiavk \
              ro.hardware.egl=adreno \
              ro.hardware.vulkan=adreno \
              persist.sys.thermal.chamber=ver2
          MAKEFILE

      - name: 5. Gaming AudioFX & Low Latency Equalizer
        run: |
          mkdir -p vendor/custom/overlay/packages/apps/AudioFX/res/values
          cat << 'XML' > vendor/custom/overlay/packages/apps/AudioFX/res/values/config_audiofx_gaming.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <bool name="config_enable_bass_boost">true</bool>
              <bool name="config_enable_virtualizer">true</bool>
              <bool name="config_enable_gaming_reverb">true</bool>
              <string name="default_preset_gaming">Gaming 3D Surround</string>
          </resources>
          XML

          mkdir -p vendor/custom/config/audio
          cat << 'MAKEFILE' > vendor/custom/config/audio/audiofx_props.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.audiofx=gaming_vip \
              audio.offload.video=true \
              audio.offload.pcm.16bit.enable=true \
              audio.offload.pcm.24bit.enable=true
          MAKEFILE

      - name: 6. Inject All Upgraded Configurations to Device Makefile
        run: |
          mkdir -p device/generic/common
          touch device/generic/common/device.mk

          cat << 'MAKEFILE' >> device/generic/common/device.mk

          # ==================== DAY 19: BY_QH ULTRA SYSTEM INTEGRATION ====================
          $(call inherit-product, vendor/custom/config/ai/ai_thread_governor.mk)
          $(call inherit-product, vendor/custom/config/memory/zram_booster.mk)$(call inherit-product, vendor/custom/config/haptics/haptic_4d.mk)
          $(call inherit-product, vendor/custom/config/graphics/vulkan13_accel.mk)$(call inherit-product, vendor/custom/config/audio/audiofx_props.mk)

          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.version.phase1=ULTRA_COMPLETED \
              ro.byqh.system.readiness=100
          MAKEFILE

      - name: 7. System Integrity Check & Pre-Flight Report
        run: |
          echo "========================================================="
          echo "       BY_QH OS VIP ANDROID 16 - ULTRA INTEGRITY CHECK   "
          echo "========================================================="
          ls -la vendor/custom/overlay/frameworks/res/values/config_play_integrity.xml || exit 1
          ls -la vendor/custom/config/byqh_branding.mk || exit 1
          ls -la vendor/custom/config/memory/zram_booster.mk || exit 1
          ls -la vendor/custom/config/graphics/vulkan13_accel.mk || exit 1
          ls -la device/generic/common/device.mk || exit 1
          echo "========================================================="
          echo " BY_QH OS SẴN SÀNG CHỜ NGÀY 20 & NGÀY 21 XUẤT FILE ZIP! "
          echo "========================================================="
