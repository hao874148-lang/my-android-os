name: Day 18 - By_qh Ultra Gaming Hardware Suite (Bypass Charging, AirTriggers, Vulkan Shader Cache & 120FPS Recorder)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  byqh-day18-hardware-suite-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 1. Integrate Bypass Charging
        run: |
          mkdir -p vendor/custom/config/power
          cat << 'RC' > vendor/custom/config/power/init.byqh.bypass_charging.rc
          on property:sys.game.bypass_charging=1
              write /sys/class/power_supply/battery/charging_enabled 0
              write /sys/class/power_supply/battery/input_suspend 1

          on property:sys.game.bypass_charging=0
              write /sys/class/power_supply/battery/charging_enabled 1
              write /sys/class/power_supply/battery/input_suspend 0
          RC

          cat << 'MAKEFILE' > vendor/custom/config/power/bypass_charging_props.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.bypass_charging=supported \
              persist.vendor.power.bypass_charge=true \
              persist.sys.game.bypass_charging=0
          MAKEFILE

      - name: 2. Virtual AirTriggers Framework
        run: |
          mkdir -p vendor/custom/overlay/packages/apps/GameSpace/res/values
          cat << 'XML' > vendor/custom/overlay/packages/apps/GameSpace/res/values/config_airtriggers.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <bool name="config_enable_virtual_airtriggers">true</bool>
              <bool name="config_volume_key_as_trigger">true</bool>
              <bool name="config_edge_touch_trigger">true</bool>
              <integer name="config_trigger_press_sensibility">95</integer>
          </resources>
          XML

          cat << 'MAKEFILE' > vendor/custom/config/power/airtrigger_props.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.airtriggers=enabled \
              persist.sys.game.keymapper=1
          MAKEFILE

      - name: 3. Vulkan Shader Pre-Compiler & 512MB Cache
        run: |
          mkdir -p vendor/custom/config/graphics
          cat << 'MAKEFILE' > vendor/custom/config/graphics/vulkan_shader_cache.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.gfx.driver.shader_cache_size=512 \
              ro.gfx.driver.shader_cache_num_compiles=8 \
              ro.byqh.vulkan.precompile_shaders=true \
              debug.hwui.use_partial_build_cache=true \
              persist.sys.vulkan.pipeline_cache=enabled
          MAKEFILE

      - name: 4. GPU Direct 120FPS Screen Recorder
        run: |
          mkdir -p vendor/custom/overlay/frameworks/base/packages/SettingsProvider/res/values
          cat << 'XML' > vendor/custom/overlay/frameworks/base/packages/SettingsProvider/res/values/defaults_recorder.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <integer name="def_screen_record_fps">120</integer>
              <integer name="def_screen_record_bitrate">60000000</integer>
              <bool name="def_screen_record_internal_audio">true</bool>
          </resources>
          XML

      - name: 5. Inject All Day 18 Hardware Rules to Device Makefile
        run: |
          mkdir -p device/generic/common
          touch device/generic/common/device.mk

          cat << 'MAKEFILE' >> device/generic/common/device.mk

          # ==================== DAY 18: BY_QH ULTRA GAMING HARDWARE SUITE ====================
          $(call inherit-product, vendor/custom/config/power/bypass_charging_props.mk)
          $(call inherit-product, vendor/custom/config/power/airtrigger_props.mk)$(call inherit-product, vendor/custom/config/graphics/vulkan_shader_cache.mk)

          PRODUCT_COPY_FILES += \
              vendor/custom/config/power/init.byqh.bypass_charging.rc:$(TARGET_COPY_OUT_VENDOR)/etc/init/hw/init.byqh.bypass_charging.rc

          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.hardware_suite.version=1.0 \
              ro.byqh.screen_recorder_120fps=enabled
          MAKEFILE

      - name: 6. Verify Created Files
        run: |
          ls -la vendor/custom/config/power/init.byqh.bypass_charging.rc
          ls -la vendor/custom/overlay/packages/apps/GameSpace/res/values/config_airtriggers.xml
          ls -la vendor/custom/config/graphics/vulkan_shader_cache.mk
          ls -la device/generic/common/device.mk
          echo "=== NGÀY 18: TÍCH HỢP BY_QH ULTRA GAMING HARDWARE SUITE HOÀN THÀNH ==="
