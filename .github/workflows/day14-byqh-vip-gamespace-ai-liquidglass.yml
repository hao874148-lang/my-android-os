name: Day 14 - By_qh VIP Game Space, Floating Window, Gemini AI Integration & Liquid Glass UI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  byqh-day14-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 1. Integration VIP Game Space Floating Window Overlay
        run: |
          mkdir -p vendor/custom/overlay/packages/apps/GameSpace/res/values
          mkdir -p vendor/custom/overlay/packages/apps/GameSpace/res/drawable
          cat << 'XML' > vendor/custom/overlay/packages/apps/GameSpace/res/values/config_gamespace_vip.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <!-- Bật VIP Floating Window & Game Assistant HUD Panel -->
              <bool name="config_enable_floating_window">true</bool>
              <bool name="config_enable_fps_monitor">true</bool>
              <bool name="config_enable_touch_booster">true</bool>
              <bool name="config_enable_crosshair_overlay">true</bool>
              <bool name="config_enable_ram_cleaner">true</bool>
              <bool name="config_game_network_priority">true</bool>
          </resources>
          XML
          echo "=== ĐÃ TÍCH HỢP VIP GAME SPACE FLOATING WINDOW OVERLAY ==="

      - name: 2. Embedded Gemini AI Assistant Framework
        run: |
          mkdir -p vendor/custom/config/ai
          cat << 'MAKEFILE' > vendor/custom/config/ai/gemini_assistant.mk
          # By_qh OS Integrated Gemini AI Framework & Voice Assistant
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.ai.gemini=enabled \
              ro.byqh.ai.assistant_type=gemini \
              ro.opa.eligible_device=true \
              persist.sys.ai.voice_trigger=true \
              persist.sys.ai.game_helper=enabled
          MAKEFILE

          mkdir -p vendor/custom/overlay/frameworks/base/core/res/res/values
          cat << 'XML' > vendor/custom/overlay/frameworks/base/core/res/res/values/config_ai_gemini.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <!-- Tích hợp Gemini AI vào phím tắt & Game Floating Window -->
              <string name="config_defaultAssistant" translatable="false">com.google.android.apps.googleassistant</string>
              <bool name="config_assistHasKeyguard" translatable="false">true</bool>
          </resources>
          XML
          echo "=== ĐÃ NHÚNG TÍNH NĂNG GEMINI AI VÀO CORE SYSTEM ==="

      - name: 3. Liquid Glass Morphism UI & Real-time Blur Rendering
        run: |
          cat << 'XML' > vendor/custom/overlay/frameworks/base/core/res/res/values/styles_liquid_glass.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <!-- Bảng màu hiệu ứng Kính chất lỏng (Liquid Glass) & Blur mờ siêu mượt -->
              <color name="liquid_glass_bg">#1AFFFFFF</color>
              <color name="liquid_glass_border">#33FFFFFF</color>
              <color name="liquid_glass_accent">#00FF88</color>
          </resources>
          XML

          mkdir -p vendor/custom/config/graphics
          cat << 'MAKEFILE' > vendor/custom/config/graphics/liquid_glass.mk
          # Liquid Glass HW Rendering & SurfaceFlinger Blur Overrides
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.sf.blurs_are_expensive=0 \
              persist.sys.sf.disable_blurs=0 \
              debug.renderengine.backend=skiavk \
              ro.surface_flinger.supports_background_blur=1 \
              persist.sys.liquid_glass_ui=true
          MAKEFILE
          echo "=== ĐÃ TÍCH HỢP HỆ THỐNG GIAO DIỆN LIQUID GLASS CỰC ĐẸP ==="

      - name: 4. Anti-Delay Banking App Notifications & Pass Bank Safety
        run: |
          mkdir -p vendor/custom/config/notifications
          cat << 'MAKEFILE' > vendor/custom/config/notifications/anti_delay_bank.mk
          # Khóa tiến trình không diệt App Ngân Hàng (MBBank, Vietcombank, MoMo, Zalo, Messenger)
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.sys.fw.empty_app_percent=50 \
              ro.sys.fw.bservice_enable=true \
              ro.sys.fw.bservice_limit=15 \
              persist.sys.fflag.override.settings_enable_monitor_phantom_procs=false \
              persist.sys.power.whitelist_gms=true
          MAKEFILE
          echo "=== ĐÃ KHÓA GIỮ THÔNG BÁO TỨC THÌ CHO APP NGÂN HÀNG & BẢO MẬT BANING ==="

      - name: 5. Inject All Day 14 Configurations to Device Makefile
        run: |
          mkdir -p device/generic/common
          touch device/generic/common/device.mk

          cat << 'MAKEFILE' >> device/generic/common/device.mk

          # ==================== DAY 14: BY_QH VIP GAME SPACE, AI GEMINI & LIQUID GLASS ====================
          $(call inherit-product, vendor/custom/config/ai/gemini_assistant.mk)
          $(call inherit-product, vendor/custom/config/graphics/liquid_glass.mk)
          $(call inherit-product, vendor/custom/config/notifications/anti_delay_bank.mk)

          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.gamespace.vip=1 \
              ro.byqh.floating_window.enabled=1 \
              ro.byqh.liquid_glass.theme=enabled
          MAKEFILE

          echo "=== ĐÃ CẬP NHẬT HOÀN TẤT DEVICE MAKEFILE CHO NGÀY 14 ==="
          tail -n 25 device/generic/common/device.mk

      - name: 6. Verify Created Files
        run: |
          ls -la vendor/custom/overlay/packages/apps/GameSpace/res/values/config_gamespace_vip.xml
          ls -la vendor/custom/config/ai/gemini_assistant.mk
          ls -la vendor/custom/config/graphics/liquid_glass.mk
          ls -la vendor/custom/config/notifications/anti_delay_bank.mk
          ls -la device/generic/common/device.mk
          echo "=== NGÀY 14: TẤT CẢ TẬP TIN DỰ ÁN ĐÃ ĐƯỢC TẠO THÀNH CÔNG ==="
