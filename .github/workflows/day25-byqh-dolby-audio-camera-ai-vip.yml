name: Day 25 - By_qh Dolby Atmos Hi-Res Audio & Camera AI GCam Enhancement
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  byqh-day25-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 1. Dolby Atmos & Hi-Res Audio Lossless Engine
        run: |
          mkdir -p vendor/custom/config/media
          cat << 'RC' > vendor/custom/config/media/init.byqh.audio.rc
          on boot
              # Tối ưu hóa Audio Hardware
              write /sys/kernel/snd_card/control "set_spk_amp 1"
              write /sys/module/snd_usb_audio/parameters/lowlatency 1
          RC
          cat << 'MAKEFILE' > vendor/custom/config/media/dolby_audio_vip.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.audio_engine=dolby_atmos_lossless \
              persist.vendor.audio.dolby.atmos.enabled=true \
              persist.vendor.audio.dolby.surround.enable=true \
              ro.config.media_vol_steps=30 \
              ro.config.vc_call_vol_steps=15 \
              audio.safx.pbe.enabled=true \
              persist.sys.audio.lossless=true \
              vendor.audio.offload.buffer.size.kb=1024 \
              vendor.audio.offload.pstimeout.secs=3 \
              persist.vendor.audio.fluence.voicemode=true \
              ro.audio.monitorNoise=true
          MAKEFILE

      - name: 2. AudioFX VIP Equalizer & Mic Recording Boost
        run: |
          mkdir -p vendor/custom/config/media
          cat << 'MAKEFILE' > vendor/custom/config/media/audiofx_vip.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.audiofx=vip_enhanced \
              persist.sys.audiofx.mode=gaming \
              persist.vendor.audio.capture.stereo=true \
              vendor.audio.capture.mic.stereo=true \
              persist.vendor.audio.capture.kpi.enable=true \
              ro.vendor.audio.sdk.fluencetype=fluencepro
          PRODUCT_PACKAGES += \
              ByqhAudioFX
          MAKEFILE

      - name: 3. Camera AI Enhancement & GCam Framework Spoofing
        run: |
          mkdir -p vendor/custom/config/media
          cat << 'MAKEFILE' > vendor/custom/config/media/camera_ai_vip.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.camera=ai_gcam_vip \
              persist.camera.HAL3.enabled=1 \
              persist.camera.eis.enabled=1 \
              persist.vendor.camera.bokeh.enable=true \
              persist.vendor.camera.hdr.enable=true \
              ro.hardware.sensor.proximity=true \
              ro.hardware.sensor.light=true \
              persist.vendor.camera.exif.make=Google \
              persist.vendor.camera.exif.model=Pixel 8 Pro \
              vendor.camera.aux.packagelist=com.android.camera,com.google.android.GoogleCamera,org.codeaurora.snapcam \
              persist.camera.gps.package=com.android.camera
          MAKEFILE

      - name: 4. Inject Day 25 Rules into Device Makefile
        run: |
          mkdir -p device/generic/common
          touch device/generic/common/device.mk
          cat << 'MAKEFILE' >> device/generic/common/device.mk
          # ==================== DAY 25: DOLBY ATMOS, AUDIOFX VIP & CAMERA AI ====================
          $(call inherit-product, vendor/custom/config/media/dolby_audio_vip.mk)
          $(call inherit-product, vendor/custom/config/media/audiofx_vip.mk)
          $(call inherit-product, vendor/custom/config/media/camera_ai_vip.mk)
          PRODUCT_COPY_FILES += \
              vendor/custom/config/media/init.byqh.audio.rc:$(TARGET_COPY_OUT_VENDOR)/etc/init/hw/init.byqh.audio.rc
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.day25.status=COMPLETED \
              ro.byqh.audio_level=dolby_lossless \
              ro.byqh.camera_level=ai_gcam_spoofed
          MAKEFILE

      - name: 5. System Integrity Check & Verification
        run: |
          echo "========================================================="
          echo " BY_QH OS VIP ANDROID 16 - DAY 25 INTEGRITY CHECK "
          echo "========================================================="
          ls -la vendor/custom/config/media/init.byqh.audio.rc || exit 1
          ls -la vendor/custom/config/media/dolby_audio_vip.mk || exit 1
          ls -la vendor/custom/config/media/audiofx_vip.mk || exit 1
          ls -la vendor/custom/config/media/camera_ai_vip.mk || exit 1
          ls -la device/generic/common/device.mk || exit 1
          echo "========================================================="
          echo " NGÀY 25 THÀNH CÔNG! ÂM THANH DOLBY ATMOS & CAMERA AI ĐỈNH CAO! "
          echo "========================================================="
