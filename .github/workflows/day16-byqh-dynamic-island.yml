name: Day 16 - By_qh Dynamic Island HUD, Smart Notifications & Pro Max UI Integration

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  byqh-dynamic-island-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 1. Integrate Dynamic Island System UI Overlay Framework
        run: |
          mkdir -p vendor/custom/overlay/packages/apps/SystemUI/res/values
          mkdir -p vendor/custom/overlay/packages/apps/SystemUI/res/layout
          cat << 'XML' > vendor/custom/overlay/packages/apps/SystemUI/res/values/config_dynamic_island.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <!-- Bật tính năng Dynamic Island & Smart Pill Notifications -->
              <bool name="config_enable_dynamic_island">true</bool>
              <bool name="config_dynamic_island_charging_animation">true</bool>
              <bool name="config_dynamic_island_media_visualizer">true</bool>
              <bool name="config_dynamic_island_call_hud">true</bool>
              <bool name="config_dynamic_island_bank_alerts">true</bool>
              <bool name="config_dynamic_island_gamespace_fps">true</bool>
              <!-- Cấu hình độ bo tròn & vị trí nốt ruồi camera -->
              <dimen name="dynamic_island_corner_radius">28dp</dimen>
              <dimen name="dynamic_island_height_min">36dp</dimen>
              <dimen name="dynamic_island_height_max">180dp</dimen>
          </resources>
          XML
          echo "=== ĐÃ KHỞI TẠO OVERLAY DYNAMIC ISLAND PRO MAX ==="

      - name: 2. Smart Notification HUD & Banking Alert Priority
        run: |
          mkdir -p vendor/custom/config/notifications
          cat << 'MAKEFILE' > vendor/custom/config/notifications/dynamic_notifications.mk
          # By_qh OS Dynamic Island & Notification Properties
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.dynamic_island=enabled \
              ro.byqh.dynamic_island.style=pro_max \
              ro.byqh.dynamic_island.animation=spring_physics \
              persist.sys.notification.island_priority=high \
              persist.sys.notification.bank_popup=true \
              persist.sys.notification.glass_blur=1
          MAKEFILE
          echo "=== ĐÃ KHỞI TẠO BỘ ƯU TIÊN THÔNG BÁO NGÂN HÀNG TRÊN DYNAMIC ISLAND ==="

      - name: 3. Glassmorphism Styling & Spring Physics Animation Rules
        run: |
          mkdir -p vendor/custom/overlay/frameworks/base/core/res/res/values
          cat << 'XML' > vendor/custom/overlay/frameworks/base/core/res/res/values/colors_dynamic_island.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <!-- Bảng màu Đảo Kính Đen Siêu Cấp Glassmorphism -->
              <color name="dynamic_island_bg_color">#E6000000</color>
              <color name="dynamic_island_accent_green">#00FF88</color>
              <color name="dynamic_island_accent_blue">#00E5FF</color>
              <color name="dynamic_island_border_light">#26FFFFFF</color>
          </resources>
          XML
          echo "=== ĐÃ KHỞI TẠO BẢNG MÀU & HIỆU ỨNG KÍNH CHO DYNAMIC ISLAND ==="

      - name: 4. Inject All Day 16 Dynamic Island Rules to Device Makefile
        run: |
          mkdir -p device/generic/common
          touch device/generic/common/device.mk

          cat << 'MAKEFILE' >> device/generic/common/device.mk

          # ==================== DAY 16: BY_QH DYNAMIC ISLAND PRO MAX ====================
          $(call inherit-product, vendor/custom/config/notifications/dynamic_notifications.mk)

          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.island.charging=1 \
              ro.byqh.island.media=1 \
              ro.byqh.island.banking=1 \
              ro.byqh.island.game_fps=1
          MAKEFILE

          echo "=== ĐÃ NỐI HOÀN TẤT CẤU HÌNH NGÀY 16 VÀO DEVICE MAKEFILE ==="
          tail -n 20 device/generic/common/device.mk

      - name: 5. Verify Created Files
        run: |
          ls -la vendor/custom/overlay/packages/apps/SystemUI/res/values/config_dynamic_island.xml
          ls -la vendor/custom/config/notifications/dynamic_notifications.mk
          ls -la vendor/custom/overlay/frameworks/base/core/res/res/values/colors_dynamic_island.xml
          ls -la device/generic/common/device.mk
          echo "=== NGÀY 16: TÍCH HỢP DYNAMIC ISLAND PRO MAX HOÀN THÀNH ==="
