name: Day 26-30 - By_qh OS Grand Finale (UI, Gestures, OTA & Final Build Prep)
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  byqh-grand-finale:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: "Day 26 - Smart Theming Engine (Material You Pro) & Eye Care"
        run: |
          mkdir -p vendor/custom/config/ui
          cat << 'MAKEFILE' > vendor/custom/config/ui/ui_customizations.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.ui=material_you_pro \
              ro.config.font=GoogleSans \
              persist.sys.icon_pack=ByqhRounded \
              persist.sys.eyecare=auto \
              ro.color.pickup=true \
              persist.sys.dalvik.vm.dex2oat.enabled=true
          MAKEFILE
          cat << 'XML' > vendor/custom/config/ui/theme_overlays.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <bool name="config_enableAutoColorExtraction">true</bool>
              <integer name="config_eyecare_filter_strength">85</integer>
              <bool name="config_ui_rounded_corners">true</bool>
          </resources>
          XML

      - name: "Day 27 - Smart Gestures (Moto/Funtouch Style) & AOD Framework"
        run: |
          mkdir -p vendor/custom/config/gestures
          cat << 'MAKEFILE' > vendor/custom/config/gestures/smart_gestures.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.gestures=smart_engine \
              persist.sys.gesture.chop_chop=1 \
              persist.sys.gesture.twist=1 \
              persist.sys.aod.always_on=true \
              ro.byqh.fod_gesture=enabled \
              persist.sys.gesture.three_finger_screenshot=1
          MAKEFILE

      - name: "Day 28 - OTA Update Framework & Seamless A/B Updates"
        run: |
          mkdir -p vendor/custom/config/ota
          cat << 'MAKEFILE' > vendor/custom/config/ota/ota_config.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.ota=appinternal_enabled \
              ro.build.ab_update=true \
              persist.sys.ota.server=https://api.byqh-os.com/v1/ota \
              ro.ota.allow_downgrade=false
          MAKEFILE
          cat << 'CONF' > vendor/custom/config/ota/update_engine.conf
          [ByqhOTA]
          server_url=https://api.byqh-os.com/v1/ota
          check_interval=86400
          auto_download=true
          CONF

      - name: "Day 29 - Final Build Prep (Release Keys, User Build & Script Gen)"
        run: |
          mkdir -p vendor/custom/config/build
          cat << 'MAKEFILE' > vendor/custom/config/build/final_build_prep.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.build.type=user \
              ro.byqh.build_stage=release \
              persist.sys.ccache.enabled=true \
              ro.secure=1 \
              ro.adb.secure=1
          MAKEFILE
          cat << 'SH' > vendor/custom/config/build/run_byqh_final_build.sh
          #!/bin/bash
          echo "================================================="
          echo " STARTING BY_QH OS VIP ANDROID 16 FINAL BUILD "
          echo "================================================="
          source build/envsetup.sh
          lunch byqh_user
          m -j$(nproc) bacon
          echo "Build Completed Successfully!"
          SH
          chmod +x vendor/custom/config/build/run_byqh_final_build.sh

      - name: "Day 30 - Grand Injection & Final System Integrity Check"
        run: |
          mkdir -p device/generic/common
          touch device/generic/common/device.mk
          cat << 'MAKEFILE' >> device/generic/common/device.mk
          # ==================== DAY 26-30: GRAND FINALE UI, OTA & BUILD PREP ====================
          $(call inherit-product, vendor/custom/config/ui/ui_customizations.mk)
          $(call inherit-product, vendor/custom/config/gestures/smart_gestures.mk)
          $(call inherit-product, vendor/custom/config/ota/ota_config.mk)
          $(call inherit-product, vendor/custom/config/build/final_build_prep.mk)
          PRODUCT_COPY_FILES += \
              vendor/custom/config/ui/theme_overlays.xml:$(TARGET_COPY_OUT_PRODUCT)/overlay/theme_overlays.xml \
              vendor/custom/config/ota/update_engine.conf:$(TARGET_COPY_OUT_SYSTEM)/etc/update_engine.conf
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.day26_30.status=COMPLETED \
              ro.byqh.os_status=GRAND_FINALE_READY \
              ro.byqh.version=VIP-A16-GAMING-V1.0-FINAL
          MAKEFILE
          
          echo "========================================================="
          echo " BY_QH OS VIP ANDROID 16 - DAY 26 TO 30 INTEGRITY CHECK "
          echo "========================================================="
          ls -la vendor/custom/config/ui/ui_customizations.mk || exit 1
          ls -la vendor/custom/config/ui/theme_overlays.xml || exit 1
          ls -la vendor/custom/config/gestures/smart_gestures.mk || exit 1
          ls -la vendor/custom/config/ota/ota_config.mk || exit 1
          ls -la vendor/custom/config/ota/update_engine.conf || exit 1
          ls -la vendor/custom/config/build/final_build_prep.mk || exit 1
          ls -la vendor/custom/config/build/run_byqh_final_build.sh || exit 1
          ls -la device/generic/common/device.mk || exit 1
          echo "========================================================="
          echo " DỰ ÁN 30 NGÀY HOÀN THÀNH! HỆ ĐIỀU HÀNH ĐÃ SẴN SÀNG XUẤT XƯỞNG! "
          echo "========================================================="

      - name: Setup Git Bot
        run: |
          git config --global user.name "byqh-os-bot"
          git config --global user.email "bot@byqh-os.com"

      - name: Commit Grand Finale
        run: |
          git add .
          git commit -m "Day 26-30: Grand Finale - UI Pro, Smart Gestures, OTA & Final Build Prep"
          git push
