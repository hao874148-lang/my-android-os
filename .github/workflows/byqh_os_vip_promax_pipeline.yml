name: By_qh OS VIP Pro Max Android 16 - Ultimate Engine Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-vip-promax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 1. Dọn Dẹp Dung Lượng & Cài Đặt Công Cụ Biên Dịch Cao Cấp
        run: |
          echo "========================================================="
          echo " [1] NÂNG CẤP DUNG LƯỢNG MÁY ẢO CLOUD "
          echo "========================================================="
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/share/boost
          sudo apt-get clean
          
          echo "========================================================="
          echo " [2] CÀI ĐẶT BỘ THƯ VIỆN TOOLCHAIN CHUẨN VIP PRO MAX "
          echo "========================================================="
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf lib32ncurses5-dev lib32z1-dev libc6-dev-i386-cross libncurses5 libncurses5-dev libreadline-dev libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          
          git config --global user.name "hao874148-lang"
          git config --global user.email "lhao874148@gmail.com"

      - name: 2. Thiết Lập Toàn Bộ Cấu Trúc Thư Mục Dự Án
        run: |
          echo "=== KHỞI TẠO CÂY THƯ MỤC CẤU HÌNH VIP PRO MAX ==="
          mkdir -p vendor/custom/config/{debloat,gaming,power,network,privacy,core,media,ui,gestures,ota,build,ai,memory,cleaner,battery,performance,haptics,graphics,audio,input,sysctl}
          mkdir -p vendor/custom/overlay/frameworks/base/core/res/res/values
          mkdir -p vendor/custom/overlay/frameworks/base/packages/SettingsProvider/res/values
          mkdir -p vendor/custom/overlay/packages/apps/{SystemUI,GameSpace,AudioFX}/res/values
          mkdir -p .repo/local_manifests
          mkdir -p device/generic/common

      - name: 3. Khai Báo Local Manifests & Dịch Vụ GApps Pass Bank
        run: |
          cat << 'XML' > .repo/local_manifests/byqh_promax_manifest.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project path="packages/apps/GameSpace" name="LineageOS/android_packages_apps_GameSpace" remote="github" revision="lineage-21.0" clone-depth="1" />
            <project path="vendor/gapps" name="NikGapps/vendor_gapps" remote="github" revision="master" clone-depth="1" />
            <project path="device/generic/common" name="LineageOS/android_device_generic_common" remote="github" revision="lineage-21.0" clone-depth="1" />
          </manifest>
          XML

      - name: 4. Khởi Tạo Thương Hiệu, Giao Diện Cyberpunk & iOS ProMotion Physics
        run: |
          # Branding VIP Pro Max
          cat << 'MAKEFILE' > vendor/custom/config/byqh_branding.mk
          PRODUCT_NAME := By_qh OS VIP Pro Max
          PRODUCT_BRAND := By_qh
          PRODUCT_MANUFACTURER := By_qh Studio
          PRODUCT_MODEL := By_qh VIP Pro Max Android 16
          
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.developer=hao874148-lang \
              ro.byqh.edition=By_qh-VIP-ProMax-Core \
              ro.build.display.id=By_qh OS v1.0 VIP Pro Max (Android 16) \
              ro.product.brand=By_qh \
              ro.product.model=By_qh VIP Pro Max Phone
          MAKEFILE

          # SystemUI Quick Tiles & Control Center
          cat << 'XML' > vendor/custom/overlay/packages/apps/SystemUI/res/values/config_systemui_gamespace.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="quick_settings_tiles_default" translatable="false">wifi,cell,bt,dnd,gamespace,fps_counter,performance_mode,bypass_charge,screenrecord,flashlight,rotation</string>
              <bool name="config_game_touch_boost_enabled">true</bool>
          </resources>
          XML

          # Pass App Ngân Hàng & CH Play (Play Integrity Fix)
          cat << 'XML' > vendor/custom/overlay/frameworks/base/core/res/res/values/config_play_integrity.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <bool name="config_hasPlayIntegritySpoof">true</bool>
              <bool name="config_spoofGoogleClient">true</bool>
              <bool name="config_avoidGmsReprovisioning">true</bool>
              <string name="config_gms_process_name" translatable="false">com.google.android.gms</string>
              <string name="config_gms_unstable_process_name" translatable="false">com.google.android.gms.unstable</string>
          </resources>
          XML

          # Ngôn ngữ mặc định 100% Tiếng Việt
          cat << 'XML' > vendor/custom/overlay/frameworks/base/core/res/res/values/config_locale.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string-array name="config_localePickerLocales" translatable="false">
                  <item>vi-VN</item>
                  <item>en-US</item>
              </string-array>
          </resources>
          XML

          # Chống trễ thông báo Zalo/Messenger/MBBank
          cat << 'CONF' > vendor/custom/config/sysctl/notifications_fix.conf
          vm.dirty_background_ratio = 5
          vm.dirty_ratio = 10
          vm.vfs_cache_pressure = 50
          CONF

          # Bảng màu Cyberpunk OLED Black & Neon Green
          cat << 'XML' > vendor/custom/overlay/frameworks/base/core/res/res/values/colors_gaming.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="primary_dark">#050608</color>
              <color name="accent_device_default_dark">#00FF88</color>
              <color name="accent_device_default_light">#00E5FF</color>
              <color name="background_floating_material_dark">#0D0E15</color>
              <color name="system_neutral1_900">#000000</color>
          </resources>
          XML

          # Dynamic Island HUD Pro Max
          cat << 'XML' > vendor/custom/overlay/packages/apps/SystemUI/res/values/config_dynamic_island.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <bool name="config_enable_dynamic_island">true</bool>
              <bool name="config_dynamic_island_charging_animation">true</bool>
              <bool name="config_dynamic_island_media_visualizer">true</bool>
              <bool name="config_dynamic_island_bank_alerts">true</bool>
              <bool name="config_dynamic_island_gamespace_fps">true</bool>
          </resources>
          XML

          # Hiệu ứng chuyển cảnh iOS ProMotion Spring Physics
          cat << 'XML' > vendor/custom/overlay/frameworks/base/core/res/res/values/config_animation_ios.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <integer name="config_activityShortDur">120</integer>
              <integer name="config_activityDefaultDur">180</integer>
              <integer name="config_activityLongDur">250</integer>
              <bool name="config_animateScreenLights">true</bool>
              <integer name="config_defaultRefreshRate">120</integer>
              <integer name="config_peakRefreshRate">144</integer>
          </resources>
          XML

      - name: 5. Khởi Tạo Tối Ưu Phần Cứng VIP ProMax (Touch 1000Hz, AI Super Res, ZRAM 16GB)
        run: |
          # E-Sports Zero Latency Touch 1000Hz
          cat << 'MAKEFILE' > vendor/custom/config/input/touch_1000hz.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.touch.sampling_rate=1000 \
              ro.byqh.touch.latency_ms=1 \
              touch.pressure.scale=0.0001 \
              view.scroll_friction=0.001 \
              windowsmgr.max_events_per_sec=360 \
              sys.use_fifo_ui=1
          MAKEFILE

          # AI Super Resolution 6.0 & Vulkan 1.3 Ray-Tracing
          cat << 'MAKEFILE' > vendor/custom/config/graphics/ai_super_res.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.ai.super_resolution=enabled \
              ro.byqh.vulkan.raytracing=true \
              debug.hwui.renderer=skiavk \
              debug.sf.latch_unsignaled=1 \
              debug.sf.enable_gl_backpressure=0 \
              persist.sys.game.sr_upscale=1.5
          MAKEFILE

          # Dynamic ZRAM 16GB LZ4/ZSTD
          cat << 'MAKEFILE' > vendor/custom/config/memory/zram_16gb_promax.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.zram.size=16384 \
              ro.byqh.zram.algorithm=zstd \
              persist.sys.zram_enabled=true \
              ro.lmk.kill_heaviest_task=false \
              ro.lmk.psi_complete_stall_ms=30 \
              persist.sys.purgeable_assets=1
          MAKEFILE

          # Bypass Charging 2.0 & Thermal Regulator
          cat << 'RC' > vendor/custom/config/power/init.byqh.bypass2.rc
          on property:sys.game.bypass_charging=1
              write /sys/class/power_supply/battery/charging_enabled 0
              write /sys/class/power_supply/battery/input_suspend 1

          on property:sys.game.bypass_charging=0
              write /sys/class/power_supply/battery/charging_enabled 1
              write /sys/class/power_supply/battery/input_suspend 0
          RC

          cat << 'MAKEFILE' > vendor/custom/config/power/bypass2_props.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.bypass_charging=v2 \
              persist.vendor.power.bypass_charge=true \
              persist.sys.battery.charge_limit=85 \
              persist.sys.battery.thermal_control=ai_auto
          MAKEFILE

          # Unlock 120 FPS Spoofing ROG Phone 8 Pro
          cat << 'MAKEFILE' > vendor/custom/config/gaming/game_unlocker.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.game_unlocker=enabled \
              persist.vendor.game.unlock_fps=120 \
              ro.product.vendor.model=ASUS_AI2401 \
              ro.product.vendor.manufacturer=asus \
              ro.product.vendor.brand=ASUS
          MAKEFILE

          # Debloat Packages Extreme
          cat << 'MAKEFILE' > vendor/custom/config/debloat/debloat_packages.mk
          PRODUCT_PACKAGES_REMOVE += \
              BasicDreams \
              BookmarkProvider \
              CellBroadcastReceiver \
              HTMLViewer \
              LiveWallpapersPicker \
              PrintServiceRecommendationService \
              PrintSpooler \
              Stk \
              Traceur \
              UserDictionaryProvider
          MAKEFILE

          # Extreme Gaming Boost Properties
          cat << 'MAKEFILE' > vendor/custom/config/gaming/extreme_gaming_boost.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.extreme_gaming=enabled \
              persist.vendor.qti.games.gt.enable=true \
              vendor.perf.gesture.status=1 \
              debug.sf.latch_unsignaled=1 \
              debug.sf.enable_gl_backpressure=0 \
              debug.egl.hw=1 \
              debug.performance.tuning=1 \
              ro.sys.fw.use_trim_settings=true \
              persist.sys.performance.level=max
          MAKEFILE

          # Ultra Battery Saver & Deep Sleep Props
          cat << 'RC' > vendor/custom/config/power/init.byqh.battery_saver.rc
          on property:sys.boot_completed=1
              write /sys/module/wlan/parameters/pno_enable 1
          RC

          cat << 'MAKEFILE' > vendor/custom/config/power/battery_saver_props.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.battery_saver=ultra \
              ro.ril.power_collapse=1 \
              pm.sleep_mode=1 \
              wifi.supplicant_scan_interval=300 \
              persist.sys.power.deep_sleep=true \
              ro.config.small_battery=false
          MAKEFILE

          # Animation Overrides
          cat << 'XML' > vendor/custom/overlay/frameworks/base/core/res/res/values/config_fluid_animations.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <integer name="config_activityShortDur">120</integer>
              <integer name="config_activityDefaultDur">180</integer>
              <integer name="config_activityLongDur">250</integer>
              <bool name="config_animateScreenLights">true</bool>
              <dimen name="config_horizontalSwipeThreshold">48dp</dimen>
          </resources>
          XML

          cat << 'MAKEFILE' > vendor/custom/config/gaming/animation_props.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.animations=super_fluid \
              view.scroll_friction=0.002 \
              persist.sys.scrollingcache=3 \
              windowsmgr.max_events_per_sec=240
          MAKEFILE

      - name: 6. Khởi Tạo Mạng 5G CA, EAS Scheduler, Dolby Lossless & AI Camera
        run: |
          # 5G/4G Carrier Aggregation & Wi-Fi 6E
          cat << 'MAKEFILE' > vendor/custom/config/network/extreme_network_boost.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.network_boost=ultra \
              persist.vendor.radio.5g_mode_pref=1 \
              persist.vendor.radio.data_con_rdx=1 \
              wifi.interface=wlan0 \
              persist.sys.wifi_6e_enabled=true
          MAKEFILE

          # DNS Over HTTPS Cloudflare
          cat << 'RC' > vendor/custom/config/network/init.byqh.doh.rc
          on boot
              setprop net.dns1 1.1.1.1
              setprop net.dns2 8.8.8.8
              setprop persist.sys.private_dns cloudflare
          RC

          cat << 'MAKEFILE' > vendor/custom/config/network/doh_props.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.doh=enabled \
              persist.sys.private_dns_mode=provider \
              persist.sys.private_dns_specifier=dns.cloudflare.com \
              net.dns1=1.1.1.1 \
              net.dns2=1.0.0.1
          MAKEFILE

          # Privacy Vault System
          cat << 'MAKEFILE' > vendor/custom/config/privacy/privacy_vault.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.privacy_vault=enabled \
              ro.byqh.app_lock=system_integrated \
              persist.sys.sensors.off_screen_privacy=1
          MAKEFILE

          # Energy Aware Scheduler (EAS)
          cat << 'RC' > vendor/custom/config/core/init.byqh.eas.rc
          on boot
              write /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor "schedutil"
              write /proc/sys/kernel/sched_energy_aware 1
          RC

          cat << 'MAKEFILE' > vendor/custom/config/core/eas_scheduler.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.eas_scheduler=enabled \
              ro.byqh.core_control=dynamic \
              persist.sys.cpu_boost=true
          MAKEFILE

          # UFS Storage Speed Boost
          cat << 'RC' > vendor/custom/config/core/init.byqh.io.rc
          on boot
              write /sys/block/sda/queue/scheduler "bfq"
              write /sys/block/sda/queue/read_ahead_kb 512
          RC

          cat << 'MAKEFILE' > vendor/custom/config/core/ufs_io_boost.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.io_boost=ufs_ultra \
              persist.sys.io_bfq=1 \
              ro.byqh.read_ahead=512kb
          MAKEFILE

          # Multitasking RAM
          cat << 'MAKEFILE' > vendor/custom/config/core/multitask_ram.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.multitasking=extreme \
              ro.sys.fw.bg_apps_limit=128
          MAKEFILE

          # Dolby Atmos Lossless Audio Engine
          cat << 'RC' > vendor/custom/config/media/init.byqh.audio.rc
          on boot
              write /sys/module/snd_usb_audio/parameters/lowlatency 1
          RC

          cat << 'MAKEFILE' > vendor/custom/config/media/dolby_audio_vip.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.audio_engine=dolby_atmos_lossless \
              persist.vendor.audio.dolby.atmos.enabled=true \
              ro.config.media_vol_steps=30
          MAKEFILE

          # AudioFX VIP
          cat << 'MAKEFILE' > vendor/custom/config/media/audiofx_vip.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.audiofx=vip_enhanced \
              persist.sys.audiofx.mode=gaming
          MAKEFILE

          # Camera AI GCam Pixel 8 Pro Spoofing
          cat << 'MAKEFILE' > vendor/custom/config/media/camera_ai_vip.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.camera=ai_gcam_vip \
              persist.camera.HAL3.enabled=1 \
              persist.vendor.camera.exif.make=Google \
              persist.vendor.camera.exif.model=Pixel 8 Pro
          MAKEFILE

      - name: 7. Khởi Tạo Giao Diện Cuối, Cử Chỉ Thông Minh & OTA Framework
        run: |
          # Material You Pro Customization
          cat << 'MAKEFILE' > vendor/custom/config/ui/ui_customizations.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.ui=material_you_pro \
              ro.config.font=GoogleSans
          MAKEFILE

          # Smart Gestures
          cat << 'MAKEFILE' > vendor/custom/config/gestures/smart_gestures.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.gestures=smart_engine \
              persist.sys.gesture.chop_chop=1
          MAKEFILE

          # OTA Config
          cat << 'MAKEFILE' > vendor/custom/config/ota/ota_config.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.ota=appinternal_enabled \
              ro.build.ab_update=true
          MAKEFILE

          # Final Build Prep & Execution Script
          cat << 'MAKEFILE' > vendor/custom/config/build/final_build_prep.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.build.type=user \
              ro.byqh.build_stage=release \
              ro.secure=1 \
              ro.adb.secure=1
          MAKEFILE

          cat << 'SH' > vendor/custom/config/build/run_byqh_final_build.sh
          #!/bin/bash
          echo "================================================="
          echo " STARTING BY_QH OS VIP PRO MAX FINAL BUILD "
          echo "================================================="
          source build/envsetup.sh
          lunch byqh_user
          m -j$(nproc) bacon
          echo "Build Completed Successfully!"
          SH
          chmod +x vendor/custom/config/build/run_byqh_final_build.sh

      - name: 8. Tổng Hợp File Master `device.mk` VIP Pro Max
        run: |
          cat << 'MAKEFILE' > device/generic/common/device.mk
          # ====================================================================
          # BY_QH OS VIP PRO MAX - MASTER DEVICE CONFIGURATION MAKEFILE
          # ====================================================================

          # Liên kết tất cả 17 Module chuẩn + Cấu hình ProMax bổ sung
          $(call inherit-product, vendor/custom/config/byqh_branding.mk)
          $(call inherit-product, vendor/custom/config/debloat/debloat_packages.mk)
          $(call inherit-product, vendor/custom/config/gaming/extreme_gaming_boost.mk)
          $(call inherit-product, vendor/custom/config/power/battery_saver_props.mk)
          $(call inherit-product, vendor/custom/config/gaming/animation_props.mk)
          $(call inherit-product, vendor/custom/config/network/extreme_network_boost.mk)
          $(call inherit-product, vendor/custom/config/network/doh_props.mk)
          $(call inherit-product, vendor/custom/config/privacy/privacy_vault.mk)
          $(call inherit-product, vendor/custom/config/core/eas_scheduler.mk)
          $(call inherit-product, vendor/custom/config/core/ufs_io_boost.mk)
          $(call inherit-product, vendor/custom/config/core/multitask_ram.mk)
          $(call inherit-product, vendor/custom/config/media/dolby_audio_vip.mk)
          $(call inherit-product, vendor/custom/config/media/audiofx_vip.mk)
          $(call inherit-product, vendor/custom/config/media/camera_ai_vip.mk)
          $(call inherit-product, vendor/custom/config/ui/ui_customizations.mk)
          $(call inherit-product, vendor/custom/config/gestures/smart_gestures.mk)
          $(call inherit-product, vendor/custom/config/ota/ota_config.mk)
          $(call inherit-product, vendor/custom/config/build/final_build_prep.mk)
          $(call inherit-product, vendor/custom/config/input/touch_1000hz.mk)
          $(call inherit-product, vendor/custom/config/graphics/ai_super_res.mk)
          $(call inherit-product, vendor/custom/config/memory/zram_16gb_promax.mk)
          $(call inherit-product, vendor/custom/config/power/bypass2_props.mk)

          # Copy tập tin khởi tạo Init Scripts
          PRODUCT_COPY_FILES += \
              vendor/custom/config/power/init.byqh.battery_saver.rc:$(TARGET_COPY_OUT_VENDOR)/etc/init/hw/init.byqh.battery_saver.rc \
              vendor/custom/config/power/init.byqh.bypass2.rc:$(TARGET_COPY_OUT_VENDOR)/etc/init/hw/init.byqh.bypass2.rc \
              vendor/custom/config/network/init.byqh.doh.rc:$(TARGET_COPY_OUT_VENDOR)/etc/init/hw/init.byqh.doh.rc \
              vendor/custom/config/core/init.byqh.eas.rc:$(TARGET_COPY_OUT_VENDOR)/etc/init/hw/init.byqh.eas.rc \
              vendor/custom/config/core/init.byqh.io.rc:$(TARGET_COPY_OUT_VENDOR)/etc/init/hw/init.byqh.io.rc \
              vendor/custom/config/media/init.byqh.audio.rc:$(TARGET_COPY_OUT_VENDOR)/etc/init/hw/init.byqh.audio.rc

          # Khai báo thuộc tính phiên bản VIP Pro Max
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.version=VIP-PROMAX-A16-GAMING-V1.0 \
              ro.byqh.system.readiness=100 \
              ro.byqh.os_status=VIP_PROMAX_READY
          MAKEFILE

      - name: 9. Đánh Giá Tính Toàn Vẹn Hệ Thống (Audit Final Integrity Check)
        run: |
          echo "========================================================="
          echo " BY_QH OS AUDITOR: KIỂM TRA TÍNH LIỀN MẠCH VIP PRO MAX "
          echo "========================================================="
          
          ERROR_COUNT=0
          
          echo "[1] Kiểm tra 17 file cấu hình (.mk) chuẩn..."
          FILES=(
            "vendor/custom/config/debloat/debloat_packages.mk"
            "vendor/custom/config/gaming/extreme_gaming_boost.mk"
            "vendor/custom/config/power/battery_saver_props.mk"
            "vendor/custom/config/gaming/animation_props.mk"
            "vendor/custom/config/network/extreme_network_boost.mk"
            "vendor/custom/config/network/doh_props.mk"
            "vendor/custom/config/privacy/privacy_vault.mk"
            "vendor/custom/config/core/eas_scheduler.mk"
            "vendor/custom/config/core/ufs_io_boost.mk"
            "vendor/custom/config/core/multitask_ram.mk"
            "vendor/custom/config/media/dolby_audio_vip.mk"
            "vendor/custom/config/media/audiofx_vip.mk"
            "vendor/custom/config/media/camera_ai_vip.mk"
            "vendor/custom/config/ui/ui_customizations.mk"
            "vendor/custom/config/gestures/smart_gestures.mk"
            "vendor/custom/config/ota/ota_config.mk"
            "vendor/custom/config/build/final_build_prep.mk"
          )
          
          for FILE in "${FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "❌ LỖI: Thiếu file $FILE"
              ERROR_COUNT=$((ERROR_COUNT+1))
            else
              echo "✔️ OK: $FILE"
            fi
          done

          echo ""
          echo "[2] Kiểm tra liên kết trong device.mk..."
          if grep -q "debloat_packages.mk" device/generic/common/device.mk && \
             grep -q "extreme_gaming_boost.mk" device/generic/common/device.mk && \
             grep -q "eas_scheduler.mk" device/generic/common/device.mk && \
             grep -q "dolby_audio_vip.mk" device/generic/common/device.mk; then
             echo "✔️ OK: device.mk đã liên kết đầy đủ các module."
          else
             echo "❌ LỖI: device.mk thiếu lệnh inherit-product!"
             ERROR_COUNT=$((ERROR_COUNT+1))
          fi

          echo "========================================================="
          if [ $ERROR_COUNT -eq 0 ]; then
            echo " 🎉 TỔNG KẾT: DỰ ÁN VIP PRO MAX HOÀN HẢO! 100% LIỀN MẠCH, SẴN SÀNG BUILD! "
          else
            echo " ⚠️ TỔNG KẾT: Phát hiện $ERROR_COUNT lỗi. Vui lòng kiểm tra lại! "
          fi
          echo "========================================================="
          exit $ERROR_COUNT
