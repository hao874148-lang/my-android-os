name: By_qh OS VIP Pro Max Android 16 - Ultimate Engine Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-vip-promax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 0. Dọn Dẹp Dung Lượng & Cài Đặt Toolchain Chuẩn VIP Pro Max
        run: |
          echo "========================================================="
          echo " [0] NÂNG CẤP DUNG LƯỢNG MÁY ẢO CLOUD "
          echo "========================================================="
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/share/boost || true
          sudo apt-get clean || true
          df -h /

          echo "========================================================="
          echo " [0.1] CÀI ĐẶT BỘ THƯ VIỆN TOOLCHAIN CHUẨN VIP PRO MAX "
          echo "========================================================="
          sudo apt-get update || true
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf libncurses-dev libreadline-dev libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 liblz4-tool || true

          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "=== TOOLCHAIN CÀI ĐẶT THÀNH CÔNG ==="

      - name: 1. Thiết Lập Toàn Bộ Cấu Trúc Thư Mục Dự Án
        run: |
          echo "=== KHỞI TẠO CÂY THƯ MỤC CẤU HÌNH VIP PRO MAX ==="
          mkdir -p vendor/custom/config/{debloat,gaming,power,network,privacy,core,media,ui,gestures,ota,build,ai,memory,cleaner,battery,performance,haptics,graphics,audio,input,sysctl,game,init,thermal,notifications,smoothness}
          mkdir -p vendor/custom/overlay/{frameworks/base/core/res/res/values,frameworks/base/packages/SettingsProvider/res/values,packages/apps/{SystemUI,GameSpace,AudioFX}/res/values,gamespace/res/values,systemui/res/values,frameworks/res/values,framework/res/values}
          mkdir -p .repo/local_manifests
          mkdir -p device/generic/common
          echo "=== CẤU TRÚC THƯ MỤC ĐÃ SẴN SÀNG ==="

      - name: 2. Khai Báo Local Manifests (Game Space, GApps, Common Device)
        run: |
          cat << 'XML' > .repo/local_manifests/byqh_promax_manifest.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project path="packages/apps/GameSpace" name="LineageOS/android_packages_apps_GameSpace" remote="github" revision="lineage-21.0" clone-depth="1" />
            <project path="vendor/gapps" name="NikGapps/vendor_gapps" remote="github" revision="master" clone-depth="1" />
            <project path="device/generic/common" name="LineageOS/android_device_generic_common" remote="github" revision="lineage-21.0" clone-depth="1" />
            <project path="packages/resources/devicesettings" name="LineageOS/android_packages_resources_devicesettings" remote="github" revision="lineage-21.0" clone-depth="1" />
          </manifest>
          XML
          echo "=== LOCAL MANIFEST ĐÃ TẠO ==="

      - name: 3. By_qh Branding & Cyberpunk UI & Play Integrity & Vietnamese Locale
        run: |
          # ===== BRANDING =====
          cat << 'MAKEFILE' > vendor/custom/config/byqh_branding.mk
          PRODUCT_NAME := By_qh OS VIP Pro Max
          PRODUCT_BRAND := By_qh
          PRODUCT_MANUFACTURER := By_qh Studio
          PRODUCT_MODEL := By_qh VIP Pro Max Android 16
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.version=VIP-PROMAX-A16-GAMING-V1.0 \
              ro.byqh.developer=hao874148-lang \
              ro.byqh.edition=By_qh-VIP-ProMax-Core \
              ro.build.display.id=By_qh OS v1.0 VIP Pro Max (Android 16) \
              ro.product.brand=By_qh \
              ro.product.model=By_qh VIP Pro Max Phone
          MAKEFILE

          # ===== PLAY INTEGRITY FIX =====
          cat << 'XML' > vendor/custom/overlay/frameworks/base/core/res/res/values/config_play_integrity.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <bool name="config_hasPlayIntegritySpoof">true</bool>
              <bool name="config_spoofGoogleClient">true</bool>
              <bool name="config_avoidGmsReprovisioning">true</bool>
              <string name="config_gms_process_name" translatable="false">com.google.android.gms</string>
              <string name="config_gms_unstable_process_name" translatable="false">com.google.android.gms.unstable</string>
          </resources>
          XML

          # ===== VIETNAMESE DEFAULT LOCALE =====
          cat << 'XML' > vendor/custom/overlay/frameworks/base/core/res/res/values/config_locale.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string-array name="config_localePickerLocales" translatable="false">
                  <item>vi-VN</item>
                  <item>en-US</item>
              </string-array>
          </resources>
          XML

          # ===== NOTIFICATION FIX SYSCTL =====
          cat << 'CONF' > vendor/custom/config/sysctl/notifications_fix.conf
          vm.dirty_background_ratio = 5
          vm.dirty_ratio = 10
          vm.vfs_cache_pressure = 50
          CONF

          # ===== CYBERPUNK OLED COLORS =====
          cat << 'XML' > vendor/custom/overlay/frameworks/base/core/res/res/values/colors_gaming.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="primary_dark">#050608</color>
              <color name="accent_device_default_dark">#00FF88</color>
              <color name="accent_device_default_light">#00E5FF</color>
              <color name="background_floating_material_dark">#0D0E15</color>
              <color name="system_neutral1_900">#000000</color>
          </resources>
          XML

          # ===== DYNAMIC ISLAND CONFIG =====
          cat << 'XML' > vendor/custom/overlay/packages/apps/SystemUI/res/values/config_dynamic_island.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <bool name="config_enable_dynamic_island">true</bool>
              <bool name="config_dynamic_island_charging_animation">true</bool>
              <bool name="config_dynamic_island_media_visualizer">true</bool>
              <bool name="config_dynamic_island_call_hud">true</bool>
              <bool name="config_dynamic_island_bank_alerts">true</bool>
              <bool name="config_dynamic_island_gamespace_fps">true</bool>
              <dimen name="dynamic_island_corner_radius">28dp</dimen>
              <dimen name="dynamic_island_height_min">36dp</dimen>
              <dimen name="dynamic_island_height_max">180dp</dimen>
          </resources>
          XML

          # ===== IOS PROMOTION ANIMATIONS =====
          cat << 'XML' > vendor/custom/overlay/frameworks/base/core/res/res/values/config_animation_ios.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <integer name="config_activityShortDur">120</integer>
              <integer name="config_activityDefaultDur">180</integer>
              <integer name="config_activityLongDur">250</integer>
              <bool name="config_animateScreenLights">true</bool>
              <integer name="config_defaultRefreshRate">120</integer>
              <integer name="config_peakRefreshRate">144</integer>
              <bool name="config_user_refresh_rate_toggle">true</bool>
          </resources>
          XML

          # ===== LIQUID GLASS COLORS =====
          cat << 'XML' > vendor/custom/overlay/frameworks/base/core/res/res/values/styles_liquid_glass.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="liquid_glass_bg">#1AFFFFFF</color>
              <color name="liquid_glass_border">#33FFFFFF</color>
              <color name="liquid_glass_accent">#00FF88</color>
          </resources>
          XML

          # ===== DYNAMIC ISLAND COLORS =====
          cat << 'XML' > vendor/custom/overlay/frameworks/base/core/res/res/values/colors_dynamic_island.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="dynamic_island_bg_color">#E6000000</color>
              <color name="dynamic_island_accent_green">#00FF88</color>
              <color name="dynamic_island_accent_blue">#00E5FF</color>
              <color name="dynamic_island_border_light">#26FFFFFF</color>
          </resources>
          XML

          # ===== FLUID ANIMATIONS =====
          cat << 'XML' > vendor/custom/overlay/frameworks/base/core/res/res/values/config_fluid_animations.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <integer name="config_activityShortDur">120</integer>
              <integer name="config_activityDefaultDur">180</integer>
              <integer name="config_activityLongDur">250</integer>
              <bool name="config_animateScreenLights">true</bool>
              <dimen name="config_horizontalSwipeThreshold">48dp</dimen>
          </resources>
          XML

          # ===== SYSTEMUI QUICK TILES =====
          cat << 'XML' > vendor/custom/overlay/packages/apps/SystemUI/res/values/config_systemui_gamespace.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="quick_settings_tiles_default" translatable="false">wifi,cell,bt,dnd,gamespace,fps_counter,performance_mode,bypass_charge,screenrecord,flashlight,rotation</string>
              <bool name="config_game_touch_boost_enabled">true</bool>
              <string name="status_bar_network_name" translatable="false">By_qh VIP Pro Max</string>
          </resources>
          XML

          # ===== AIRTRIGGERS =====
          cat << 'XML' > vendor/custom/overlay/packages/apps/GameSpace/res/values/config_airtriggers.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <bool name="config_enable_virtual_airtriggers">true</bool>
              <bool name="config_volume_key_as_trigger">true</bool>
              <bool name="config_edge_touch_trigger">true</bool>
              <integer name="config_trigger_press_sensibility">95</integer>
          </resources>
          XML

          # ===== VIP GAME SPACE FLOATING WINDOW =====
          cat << 'XML' > vendor/custom/overlay/packages/apps/GameSpace/res/values/config_gamespace_vip.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <bool name="config_enable_floating_window">true</bool>
              <bool name="config_enable_fps_monitor">true</bool>
              <bool name="config_enable_touch_booster">true</bool>
              <bool name="config_enable_crosshair_overlay">true</bool>
              <bool name="config_enable_ram_cleaner">true</bool>
              <bool name="config_game_network_priority">true</bool>
          </resources>
          XML

          # ===== AUDIOFX GAMING =====
          cat << 'XML' > vendor/custom/overlay/packages/apps/AudioFX/res/values/config_audiofx_gaming.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <bool name="config_enable_bass_boost">true</bool>
              <bool name="config_enable_virtualizer">true</bool>
              <bool name="config_enable_gaming_reverb">true</bool>
              <string name="default_preset_gaming">Gaming 3D Surround Pro</string>
          </resources>
          XML

          # ===== 120FPS SCREEN RECORDER DEFAULTS =====
          cat << 'XML' > vendor/custom/overlay/frameworks/base/packages/SettingsProvider/res/values/defaults_recorder.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <integer name="def_screen_record_fps">120</integer>
              <integer name="def_screen_record_bitrate">60000000</integer>
              <bool name="def_screen_record_internal_audio">true</bool>
          </resources>
          XML

          # ===== GEMINI AI ASSISTANT =====
          cat << 'XML' > vendor/custom/overlay/frameworks/base/core/res/res/values/config_ai_gemini.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="config_defaultAssistant" translatable="false">com.google.android.apps.googleassistant</string>
              <bool name="config_assistHasKeyguard" translatable="false">true</bool>
          </resources>
          XML

          # ===== THEME OVERLAYS =====
          cat << 'XML' > vendor/custom/config/ui/theme_overlays.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <bool name="config_enableAutoColorExtraction">true</bool>
              <integer name="config_eyecare_filter_strength">85</integer>
              <bool name="config_ui_rounded_corners">true</bool>
          </resources>
          XML

          # ===== POWERHINT GAME SPACE =====
          cat << 'XML' > vendor/custom/config/power/powerhint_gamespace.xml
          <?xml version="1.0" encoding="utf-8"?>
          <powerhint>
              <profile name="game">
                  <property name="scaling_governor" value="performance" />
                  <property name="ro.surface_flinger.set_idle_timer_ms" value="0" />
                  <property name="ro.surface_flinger.set_touch_timer_ms" value="0" />
                  <property name="vendor.gpu.boost" value="1" />
              </profile>
          </powerhint>
          XML

          # ===== THERMAL ENGINE GAMING =====
          cat << 'XML' > vendor/custom/config/thermal/thermal-engine-gaming.xml
          <?xml version="1.0" encoding="utf-8"?>
          <thermal_configuration>
              <thresholds>
                  <cpu_threshold_warning>75</cpu_threshold_warning>
                  <cpu_threshold_critical>85</cpu_threshold_critical>
                  <gpu_threshold_critical>90</gpu_threshold_critical>
              </thresholds>
          </thermal_configuration>
          XML

          # ===== SOUND RADAR 3D =====
          cat << 'XML' > vendor/custom/config/audio/sound_radar_3d.xml
          <?xml version="1.0" encoding="utf-8"?>
          <sound_radar_config>
              <gaming_audio_boost>
                  <footstep_enhancer level="max" frequency_range="1000Hz-4000Hz"/>
                  <gunfire_direction_3d enabled="true"/>
                  <spatial_surround_sound_virtualizer enabled="true"/>
                  <low_latency_audio_buffer_ms>10</low_latency_audio_buffer_ms>
              </gaming_audio_boost>
          </sound_radar_config>
          XML

          # ===== OTA UPDATE ENGINE CONF =====
          cat << 'CONF' > vendor/custom/config/ota/update_engine.conf
          [ByqhOTA]
          server_url=https://api.byqh-os.com/v1/ota
          check_interval=86400
          auto_download=true
          CONF

          echo "=== STEP 3: BRANDING & UI OVERLAYS ĐÃ TẠO XONG ==="

      - name: 4. Tối Ưu Phần Cứng VIP ProMax (Touch 1000Hz, AI Super Res, ZRAM 16GB, Gaming Boost)
        run: |
          # ===== TOUCH 1000HZ =====
          cat << 'MAKEFILE' > vendor/custom/config/input/touch_1000hz.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.touch.sampling_rate=1000 \
              ro.byqh.touch.latency_ms=1 \
              touch.pressure.scale=0.0001 \
              view.scroll_friction=0.001 \
              windowsmgr.max_events_per_sec=360 \
              sys.use_fifo_ui=1
          MAKEFILE

          # ===== AI SUPER RESOLUTION =====
          cat << 'MAKEFILE' > vendor/custom/config/graphics/ai_super_res.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.ai.super_resolution=enabled \
              ro.byqh.vulkan.raytracing=true \
              debug.hwui.renderer=skiavk \
              debug.sf.latch_unsignaled=1 \
              debug.sf.enable_gl_backpressure=0 \
              persist.sys.game.sr_upscale=1.5
          MAKEFILE

          # ===== ZRAM 16GB PROMAX =====
          cat << 'MAKEFILE' > vendor/custom/config/memory/zram_16gb_promax.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.zram.size=16384 \
              ro.byqh.zram.algorithm=zstd \
              persist.sys.zram_enabled=true \
              ro.lmk.kill_heaviest_task=false \
              ro.lmk.psi_complete_stall_ms=30 \
              persist.sys.purgeable_assets=1
          MAKEFILE

          # ===== ZRAM BOOSTER (12GB ALT) =====
          cat << 'MAKEFILE' > vendor/custom/config/memory/zram_booster.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.zram.booster=enabled \
              persist.sys.zram_compact=true
          MAKEFILE

          # ===== BYPASS CHARGING 2.0 INIT =====
          cat << 'RC' > vendor/custom/config/power/init.byqh.bypass2.rc
          on property:sys.game.bypass_charging=1
              write /sys/class/power_supply/battery/charging_enabled 0
              write /sys/class/power_supply/battery/input_suspend 1
          on property:sys.game.bypass_charging=0
              write /sys/class/power_supply/battery/charging_enabled 1
              write /sys/class/power_supply/battery/input_suspend 0
          RC

          cat << 'MAKEFILE' > vendor/custom/config/power/bypass2_props.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.bypass_charging=v2 \
              persist.vendor.power.bypass_charge=true \
              persist.sys.battery.charge_limit=85 \
              persist.sys.battery.thermal_control=ai_auto
          MAKEFILE

          # ===== BYPASS CHARGING V1 (DAY 18) =====
          cat << 'RC' > vendor/custom/config/power/init.byqh.bypass_charging.rc
          on property:sys.game.bypass_charging=1
              write /sys/class/power_supply/battery/charging_enabled 0
              write /sys/class/power_supply/battery/input_suspend 1
          on property:sys.game.bypass_charging=0
              write /sys/class/power_supply/battery/charging_enabled 1
              write /sys/class/power_supply/battery/input_suspend 0
          RC

          cat << 'MAKEFILE' > vendor/custom/config/power/bypass_charging_props.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.bypass_charging=supported \
              persist.vendor.power.bypass_charge=true \
              persist.sys.game.bypass_charging=0
          MAKEFILE

          # ===== AIRTRIGGER PROPS =====
          cat << 'MAKEFILE' > vendor/custom/config/power/airtrigger_props.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.airtriggers=enabled \
              persist.sys.game.keymapper=1
          MAKEFILE

          # ===== VULKAN SHADER CACHE =====
          cat << 'MAKEFILE' > vendor/custom/config/graphics/vulkan_shader_cache.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.gfx.driver.shader_cache_size=512 \
              ro.gfx.driver.shader_cache_num_compiles=8 \
              ro.byqh.vulkan.precompile_shaders=true \
              debug.hwui.use_partial_build_cache=true \
              persist.sys.vulkan.pipeline_cache=enabled
          MAKEFILE

          # ===== VULKAN 1.3 RAY TRACING =====
          cat << 'MAKEFILE' > vendor/custom/config/graphics/vulkan13_accel.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.vulkan.version=1.3 \
              ro.byqh.vulkan.raytracing=supported \
              debug.hwui.renderer=skiavk \
              ro.hardware.egl=adreno \
              ro.hardware.vulkan=adreno \
              persist.sys.thermal.chamber=ver3_ai \
              debug.sf.enable_gl_backpressure=0
          MAKEFILE

          # ===== LIQUID GLASS GRAPHICS =====
          cat << 'MAKEFILE' > vendor/custom/config/graphics/liquid_glass.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.sf.blurs_are_expensive=0 \
              persist.sys.sf.disable_blurs=0 \
              debug.renderengine.backend=skiavk \
              ro.surface_flinger.supports_background_blur=1 \
              persist.sys.liquid_glass_ui=true
          MAKEFILE

          # ===== GAME UNLOCKER (ROG PHONE 8 SPOOF) =====
          cat << 'MAKEFILE' > vendor/custom/config/gaming/game_unlocker.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.game_unlocker=enabled \
              persist.vendor.game.unlock_fps=120 \
              ro.product.vendor.model=ASUS_AI2401 \
              ro.product.vendor.manufacturer=asus \
              ro.product.vendor.brand=ASUS \
              ro.product.vendor.device=ASUS_AI2401 \
              persist.sys.game.spoof_device=true
          MAKEFILE

          # ===== EXTREME GAMING BOOST =====
          cat << 'MAKEFILE' > vendor/custom/config/gaming/extreme_gaming_boost.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.extreme_gaming=enabled \
              persist.vendor.qti.games.gt.enable=true \
              vendor.perf.gesture.status=1 \
              debug.sf.latch_unsignaled=1 \
              debug.sf.enable_gl_backpressure=0 \
              debug.egl.hw=1 \
              debug.performance.tuning=1 \
              ro.sys.fw.use_trim_settings=true \
              persist.sys.performance.level=max
          MAKEFILE

          # ===== ANIMATION PROPS =====
          cat << 'MAKEFILE' > vendor/custom/config/gaming/animation_props.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.animations=super_fluid \
              view.scroll_friction=0.002 \
              persist.sys.scrollingcache=3 \
              windowsmgr.max_events_per_sec=240
          MAKEFILE

          # ===== DEBLOAT PACKAGES =====
          cat << 'MAKEFILE' > vendor/custom/config/debloat/debloat_packages.mk
          PRODUCT_PACKAGES_REMOVE += \
              BasicDreams \
              BookmarkProvider \
              CellBroadcastReceiver \
              HTMLViewer \
              LiveWallpapersPicker \
              PrintServiceRecommendationService \
              PrintSpooler \
              Stk \
              Traceur \
              UserDictionaryProvider
          MAKEFILE

          # ===== BATTERY SAVER INIT =====
          cat << 'RC' > vendor/custom/config/power/init.byqh.battery_saver.rc
          on property:sys.boot_completed=1
              write /sys/module/wlan/parameters/pno_enable 1
          on property:fb.blankstate=1
              write /sys/devices/system/cpu/cpufreq/policy0/scaling_governor "powersave"
          on property:fb.blankstate=0
              write /sys/devices/system/cpu/cpufreq/policy0/scaling_governor "schedutil"
          RC

          cat << 'MAKEFILE' > vendor/custom/config/power/battery_saver_props.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.battery_saver=ultra \
              ro.ril.power_collapse=1 \
              pm.sleep_mode=1 \
              wifi.supplicant_scan_interval=300 \
              persist.sys.power.deep_sleep=true \
              ro.config.small_battery=false
          MAKEFILE

          # ===== SMART CHARGING CONTROLLER =====
          cat << 'RC' > vendor/custom/config/battery/init.byqh.smart_charge.rc
          on property:persist.sys.battery.charge_limit=80
              write /sys/class/power_supply/battery/charge_control_limit_max 80
          on property:persist.sys.battery.charge_limit=100
              write /sys/class/power_supply/battery/charge_control_limit_max 100
          RC

          cat << 'MAKEFILE' > vendor/custom/config/battery/smart_charge_props.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.smart_charging=enabled \
              persist.sys.battery.charge_limit=80 \
              persist.sys.battery.thermal_control=true \
              ro.ril.power_collapse=1 \
              persist.vendor.power.smart_charge=1
          MAKEFILE

          # ===== KERNEL GAMING INIT =====
          cat << 'RC' > vendor/custom/config/init/init.byqh.gaming.rc
          on boot
              write /sys/block/mmcblk0/queue/scheduler "bfq"
              write /sys/block/sda/queue/scheduler "bfq"
              write /sys/block/sda/queue/read_ahead_kb 2048
              write /sys/block/zram0/comp_algorithm "lz4"
              write /sys/class/input/input0/enabled 1
          on property:sys.boot_completed=1
              write /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor "schedutil"
              write /sys/devices/system/cpu/cpu4/cpufreq/scaling_governor "performance"
              write /sys/class/kgsl/kgsl-3d0/devfreq/governor "msm-adreno-tz"
              write /proc/sys/net/ipv4/tcp_congestion_control "bbr"
              write /proc/sys/net/core/default_qdisc "fq"
          RC

          cat << 'MAKEFILE' > vendor/custom/config/kernel_gaming_props.mk
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.byqh.kernel.tuning=1 \
              ro.byqh.touch.sensitivity=100 \
              ro.byqh.gpu.boost=1 \
              persist.vendor.qti.games.gt.enable=true \
              debug.egl.hw=1 \
              debug.sf.latch_unsignaled=1 \
              vendor.perf.gesture.status=1 \
              persist.sys.scrollingcache=3 \
              sys.use_fifo_ui=1
          MAKEFILE

