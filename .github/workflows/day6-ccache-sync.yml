name: Day 6 - Ccache & Optimized Sync Test

on:
  workflow_dispatch:

jobs:
  test-ccache-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cleanup & Install Dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          sudo apt-get update
          sudo apt-get install -y ccache curl git python3
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo

      - name: Setup Ccache
        run: |
          mkdir -p ~/.ccache
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 10G
          echo "=== TRẠNG THÁI CCACHE BAN ĐẦU ==="
          ccache -s

      - name: Test Optimized Repo Sync
        run: |
          git config --global user.name "hao874148-lang"
          git config --global user.email "lhao874148@gmail.com"
          mkdir -p ~/android-source && cd ~/android-source
          ~/bin/repo init -u https://github.com/LineageOS/android.git -b lineage-21.0 --depth=1

          echo "=== TẢI THỬ DỮ LIỆU VỚI CỜ TỐI ƯU ==="
          ~/bin/repo sync -c -j$(nproc) --no-clone-bundle --no-tags --force-sync build/make

          echo "=== THÔNG SỐ CCACHE VÀ MÃ NGUỒN VỪA TẢI ==="
          ls -la build/make
          ccache -s
